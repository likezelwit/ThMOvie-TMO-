<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTMO - Dashboard Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f8;--surface:#fff;--border:#e2e6f0;--text:#1a1d2e;--text2:#6b7294;--accent:#2563eb;--accent-light:#dbeafe;--success:#16a34a;--success-light:#dcfce7;--warn:#ea580c;--warn-light:#fff7ed;--danger:#dc2626;--danger-light:#fee2e2;--purple:#7c3aed;--purple-light:#ede9fe;--coming:#ff5722;--coming-light:#ffe0d6;--radius:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--shadow-lg:0 4px 16px rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c7cce0;border-radius:3px}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s;box-shadow:2px 0 8px rgba(0,0,0,.04)}
.sidebar-logo{padding:22px 24px;font-size:1.5rem;font-weight:900;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#eff6ff,#fff)}
.sidebar-logo i{color:var(--accent)}.sidebar-logo span{color:var(--accent)}
.sidebar-nav{flex:1;padding:14px;display:flex;flex-direction:column;gap:4px}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:10px;color:var(--text2);cursor:pointer;transition:.2s;font-weight:600;font-size:.88rem;position:relative;text-decoration:none}
.sidebar-item:hover{background:var(--accent-light);color:var(--accent)}
.sidebar-item.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.sidebar-item i{width:20px;text-align:center;font-size:.95rem}
.sidebar-badge{background:var(--danger);color:#fff;font-size:.62rem;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center;font-weight:800}
.sidebar-footer{padding:14px;border-top:1px solid var(--border)}
.main{margin-left:260px;flex:1;min-height:100vh;display:flex;flex-direction:column}
.top-bar{padding:14px 28px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.hamburger{display:none;background:none;border:1px solid var(--border);color:var(--text);font-size:1.1rem;cursor:pointer;padding:6px 10px;border-radius:8px}
.hamburger:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.top-bar h1{font-size:1.15rem;font-weight:800;flex:1}
.top-actions{display:flex;gap:8px}
.content-body{padding:28px;flex:1}
.section{display:none;animation:fadeIn .3s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:16px;transition:.25s;box-shadow:var(--shadow)}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.stat-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.stat-icon.blue{background:var(--accent-light);color:var(--accent)}
.stat-icon.orange{background:var(--warn-light);color:var(--warn)}
.stat-icon.green{background:var(--success-light);color:var(--success)}
.stat-icon.purple{background:var(--purple-light);color:var(--purple)}
.stat-icon.coming{background:var(--coming-light);color:var(--coming)}
.stat-icon.red{background:var(--danger-light);color:var(--danger)}
.stat-num{font-size:1.7rem;font-weight:800;line-height:1}
.stat-label{font-size:.8rem;color:var(--text2);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:.2s;box-shadow:var(--shadow)}
.card:hover{box-shadow:var(--shadow-lg)}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-title{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--text)}
.type-tag{font-size:.6rem;font-weight:800;padding:3px 9px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.type-tag.movie{background:var(--accent-light);color:var(--accent)}
.type-tag.series{background:var(--warn-light);color:var(--warn)}
.type-tag.ova{background:var(--purple-light);color:var(--purple)}
.type-tag.coming{background:var(--coming-light);color:var(--coming)}
.status-tag{font-size:.65rem;font-weight:700;padding:4px 12px;border-radius:20px;flex-shrink:0}
.status-tag.pending{background:var(--warn-light);color:var(--warn)}
.status-tag.published{background:var(--success-light);color:var(--success)}
.status-tag.rejected{background:var(--danger-light);color:var(--danger)}
.status-tag.coming{background:var(--coming-light);color:var(--coming)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.meta-chip{font-size:.73rem;color:var(--text2);background:var(--bg);padding:4px 10px;border-radius:6px;font-weight:500}
.card-details{font-size:.84rem;color:var(--text2);line-height:1.7;margin-bottom:14px}
.card-details strong{color:var(--text);font-weight:600}
.card-footer{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border)}
.btn{border:none;padding:9px 18px;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s;font-family:'Inter',sans-serif;font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.3)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#15803d;box-shadow:0 2px 8px rgba(22,163,74,.3)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c;box-shadow:0 2px 8px rgba(220,38,38,.3)}
.btn-warn{background:var(--warn);color:#fff}.btn-warn:hover{background:#c2410c;box-shadow:0 2px 8px rgba(234,88,12,.3)}
.btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#6d28d9;box-shadow:0 2px 8px rgba(124,58,237,.3)}
.btn-coming{background:var(--coming);color:#fff}.btn-coming:hover{background:#e64a19;box-shadow:0 2px 8px rgba(255,87,34,.3)}
.btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--text2);color:var(--text);background:var(--bg)}
.btn-sm{padding:6px 12px;font-size:.75rem;border-radius:6px}
.btn-lg{padding:12px 28px;font-size:.95rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.form-group{margin-bottom:18px}
.form-label{display:block;font-weight:600;margin-bottom:6px;font-size:.85rem;color:var(--text)}
.form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);outline:none;font-size:.9rem;font-family:'Inter',sans-serif;transition:.2s}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-input[readonly]{background:var(--bg);color:var(--text2)}
textarea.form-input{min-height:80px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ep-list{max-height:400px;overflow-y:auto;padding-right:4px}
.ep-item{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
.ep-item-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ep-num{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.ep-num-input{width:52px;padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);text-align:center;font-weight:700;font-size:.85rem;font-family:'JetBrains Mono',monospace}
.ep-title-input{flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:.85rem;outline:none}
.ep-title-input:focus{border-color:var(--accent)}
.ep-remove{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 6px;border-radius:4px;font-size:.85rem;transition:.2s}
.ep-remove:hover{color:var(--danger);background:var(--danger-light)}
.ep-url{font-family:'JetBrains Mono',monospace;font-size:.76rem;width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--accent);outline:none}
.ep-url:focus{border-color:var(--accent)}
.ep-url.converted{color:var(--success)!important;border-color:var(--success)!important;background:var(--success-light)!important}
.ep-url.already-converted{color:var(--success)!important;border-color:var(--success)!important;background:var(--success-light)!important;opacity:.7}
.add-ep-btn{width:100%;padding:12px;border:2px dashed var(--border);border-radius:10px;background:transparent;color:var(--text2);cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s;font-family:'Inter',sans-serif}
.add-ep-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;opacity:0;pointer-events:none;transition:opacity .3s;overflow-y:auto}
.modal-overlay.active{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:680px;transform:translateY(20px) scale(.97);transition:transform .35s cubic-bezier(.175,.885,.32,1.275);margin-bottom:40px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-overlay.active .modal{transform:translateY(0) scale(1)}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2;border-radius:18px 18px 0 0}
.modal-head h3{font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--text)}
.modal-close{background:none;border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:6px;transition:.2s}
.modal-close:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-light)}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 18px 18px}
.modal-divider{border:none;border-top:1px solid var(--border);margin:20px 0}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state i{font-size:3rem;color:var(--border);margin-bottom:14px;display:block}
.empty-state h3{font-size:1.1rem;color:var(--text);margin-bottom:6px}
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-weight:600;font-size:.8rem;transition:.2s;font-family:'Inter',sans-serif}
.filter-btn:hover{border-color:var(--text2);color:var(--text)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(37,99,235,.25)}
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--surface);color:var(--text);padding:14px 20px;border-radius:12px;font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.12);border-left:4px solid var(--success);pointer-events:auto;transform:translateX(120%);transition:transform .4s cubic-bezier(.175,.885,.32,1.275);max-width:380px;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(0)}
.toast.error{border-left-color:var(--danger)}
.toast i{font-size:1.1rem;flex-shrink:0}
.pub-card{display:flex;gap:16px;align-items:flex-start}
.pub-poster{width:80px;height:120px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--border)}
.pub-poster img{width:100%;height:100%;object-fit:cover}
.pub-info{flex:1;min-width:0}
.pub-title{font-weight:800;font-size:1rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pub-meta{font-size:.8rem;color:var(--text2);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pub-ep-count{display:inline-flex;align-items:center;gap:4px;font-size:.73rem;color:var(--warn);background:var(--warn-light);padding:3px 10px;border-radius:5px;font-weight:700}
.pub-ep-count.ok{color:var(--success);background:var(--success-light)}
.coming-soon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.coming-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:.2s;box-shadow:var(--shadow)}
.coming-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.coming-poster{width:100%;height:140px;border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--border)}
.coming-poster img{width:100%;height:100%;object-fit:cover}
.coming-title{font-weight:800;font-size:.9rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coming-meta{font-size:.75rem;color:var(--text2);margin-bottom:10px}
.coming-status{display:inline-block;background:var(--coming-light);color:var(--coming);padding:3px 10px;border-radius:20px;font-size:.65rem;font-weight:700;margin-bottom:10px}
.coming-actions{display:flex;gap:6px;flex-wrap:wrap}
.coming-actions .btn{width:100%;justify-content:center}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;display:none}
.sidebar-backdrop.show{display:block}
.main{margin-left:0}
.hamburger{display:block}
.content-body{padding:16px}
.stats-grid{grid-template-columns:1fr 1fr}
.form-row{grid-template-columns:1fr}
.pub-card{flex-direction:column;align-items:center;text-align:center}
.pub-poster{width:100px;height:150px}
.modal{max-width:100%}
.modal-overlay{padding:16px}
.coming-soon-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr}.card-footer{flex-direction:column}.card-footer .btn{width:100%;justify-content:center}.coming-soon-grid{grid-template-columns:1fr}}
</style>
<base target="_blank">
</head>
<body>

<aside class="sidebar" id="sidebar">
<div class="sidebar-logo"><i class="fas fa-play-circle"></i> DTMO <span>Admin</span></div>
<nav class="sidebar-nav">
<a class="sidebar-item active" data-section="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
<a class="sidebar-item" data-section="requests"><i class="fas fa-inbox"></i> Permintaan <span class="sidebar-badge" id="pendingBadge" style="display:none">0</span></a>
<a class="sidebar-item" data-section="published"><i class="fas fa-film"></i> Film Terbit</a>
<a class="sidebar-item" data-section="coming"><i class="fas fa-clock"></i> Coming Soon</a>
</nav>
<div class="sidebar-footer">
<a class="sidebar-item" href="../index.html"><i class="fas fa-external-link-alt"></i> Ke Website</a>
</div>
</aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="main">
<header class="top-bar">
<button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
<h1 id="pageTitle">Dashboard</h1>
<div class="top-actions">
<button class="btn btn-primary btn-sm" id="btnManualPublish"><i class="fas fa-plus"></i> Publikasi Manual</button>
<button class="btn btn-coming btn-sm" onclick="openComingSoonModal()"><i class="fas fa-clock"></i> Tambah CS</button>
</div>
</header>

<div class="content-body">
<section id="sec-dashboard" class="section active">
<div class="stats-grid">
<div class="stat-card"><div class="stat-icon orange"><i class="fas fa-inbox"></i></div><div><div class="stat-num" id="statPending">0</div><div class="stat-label">Permintaan Pending</div></div></div>
<div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div><div class="stat-num" id="statPublished">0</div><div class="stat-label">Film Terbit</div></div></div>
<div class="stat-card"><div class="stat-icon coming"><i class="fas fa-clock"></i></div><div><div class="stat-num" id="statComing">0</div><div class="stat-label">Coming Soon</div></div></div>
<div class="stat-card"><div class="stat-icon purple"><i class="fas fa-list-ol"></i></div><div><div class="stat-num" id="statEpisodes">0</div><div class="stat-label">Total Episode</div></div></div>
<div class="stat-card"><div class="stat-icon red"><i class="fas fa-ban"></i></div><div><div class="stat-num" id="statRejected">0</div><div class="stat-label">Ditolak</div></div></div>
</div>
<h3 style="font-size:1rem;font-weight:800;margin-bottom:14px;color:var(--warn)"><i class="fas fa-clock" style="margin-right:6px"></i>Permintaan Terbaru</h3>
<div id="recentRequests"></div>
</section>

<section id="sec-requests" class="section">
<div class="filter-bar">
<button class="filter-btn active" data-filter="pending">Pending</button>
<button class="filter-btn" data-filter="published">Diterbitkan</button>
<button class="filter-btn" data-filter="coming">Sedang Diterbitkan</button>
<button class="filter-btn" data-filter="rejected">Ditolak</button>
<button class="filter-btn" data-filter="all">Semua</button>
</div>
<div id="requestsList"></div>
</section>

<section id="sec-published" class="section">
<div id="publishedList"></div>
</section>

<section id="sec-coming" class="section">
<h3 style="font-size:1rem;font-weight:800;margin-bottom:14px;color:var(--coming)"><i class="fas fa-clock" style="margin-right:6px"></i>Film Coming Soon</h3>
<div id="comingSoonList"></div>
</section>
</div>
</div>

<div class="modal-overlay" id="publishModal">
<div class="modal">
<div class="modal-head">
<h3><i class="fas fa-upload" style="color:var(--accent)"></i> <span id="publishModalTitle">Publikasikan Film</span></h3>
<button class="modal-close" onclick="closePublishModal()"><i class="fas fa-times"></i></button>
</div>
<div class="modal-body">
<input type="hidden" id="pubRequestId">
<div class="form-row">
<div class="form-group"><label class="form-label">Judul</label><input type="text" class="form-input" id="pubTitle" readonly></div>
<div class="form-group"><label class="form-label">Tipe</label><input type="text" class="form-input" id="pubType" readonly style="text-transform:uppercase;font-weight:700;letter-spacing:1px"></div>
</div>
<div class="form-row">
<div class="form-group"><label class="form-label">Tahun Rilis</label><input type="text" class="form-input" id="pubYear" readonly></div>
<div class="form-group"><label class="form-label">Rating / 10</label><input type="number" class="form-input" id="pubRating" placeholder="8.5" min="0" max="10" step="0.1"></div>
</div>
<div class="form-group"><label class="form-label">Genre</label><input type="text" class="form-input" id="pubGenre" readonly></div>
<div class="form-group"><label class="form-label">URL Poster</label><input type="url" class="form-input" id="pubPoster" placeholder="https://..."></div>
<div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-input" id="pubDesc" placeholder="Sinopsis atau deskripsi singkat..."></textarea></div>
<div id="pubEpSection" style="display:none">
<hr class="modal-divider">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
<h4 style="font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--warn)"><i class="fas fa-list-ol"></i> Episode</h4>
<div style="display:flex;gap:8px;align-items:center">
<label class="form-label" style="margin:0;white-space:nowrap">Jumlah:</label>
<input type="number" class="form-input" id="pubEpCount" style="width:70px;padding:6px 10px;text-align:center" min="1" value="1">
<button class="btn btn-ghost btn-sm" onclick="generateEpFields()"><i class="fas fa-sync-alt"></i> Generate</button>
</div>
</div>
<div class="ep-list" id="pubEpList"></div>
<button class="add-ep-btn" onclick="addEpField()"><i class="fas fa-plus"></i> Tambah Episode</button>
<div style="margin-top:12px;text-align:right">
<button class="btn btn-ghost btn-sm" onclick="convertAllEpUrls()" id="btnConvertAll" style="display:none"><i class="fas fa-magic"></i> Konversi Semua URL</button>
</div>
</div>
<div id="pubVideoSection" style="display:none">
<hr class="modal-divider">

function showToast(msg,type='success'){
const c=document.getElementById('toastContainer'),t=document.createElement('div');
t.className=`toast ${type==='error'?'error':''}`;
t.innerHTML=`<i class="fas ${type==='error'?'fa-times-circle':'fa-check-circle'}" style="color:${type==='error'?'var(--danger)':'var(--success)'}"></i><span>${msg}</span>`;
c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));
setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400)},3500);
}

function convertVideoUrl(url){
if(!url)return'';
url=url.trim();
if(url.includes('drive.google.com')){
const fileIdMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
if(fileIdMatch && fileIdMatch[1]){
return `https://www.googleapis.com/drive/v3/files/${fileIdMatch[1]}?alt=media&key=${GDRIVE_API_KEY}`;
}
if(url.includes('googleapis.com')){return url;}
}
if(url.includes('dropbox.com')){
url=url.replace(/[?&]dl=[^&]*/g,'');
url=url.replace(/[?&]raw=0[^&]*/g,'');
url=url.replace(/\?&/g,'?').replace(/&&/g,'&').replace(/[?&]$/,'');
if(/[?&]raw=1(?:&|$)/.test(url)){return url;}
url+=(url.includes('?')?'&raw=1':'?raw=1');
return url;
}
return url;
}

function isConverted(url){
if(!url)return false;
return /[?&]raw=1(?:&|$)/.test(url) || url.includes('googleapis.com');
}

function parseEpisodeNumbers(text){
if(!text)return[];
const nums=new Set();
text.split(',').forEach(p=>{p=p.trim();if(p.includes('-')){const[a,b]=p.split('-').map(Number);for(let i=a;i<=b;i++)nums.add(i)}else{const n=parseInt(p);if(!isNaN(n))nums.add(n)}});
return[...nums].sort((a,b)=>a-b);
}

function formatDate(ts){if(!ts)return'-';return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

function loadAllData(){
onValue(ref(db,'requests'),snap=>{
allRequests=[];
const data=snap.val();
if(data)Object.entries(data).forEach(([id,r])=>allRequests.push({id,...r}));
allRequests.sort((a,b)=>(b.requestedAt||0)-(a.requestedAt||0));

});
onValue(ref(db,'movies'),snap=>{
allPublished=[];
const data=snap.val();
if(data)Object.entries(data).forEach(([id,m])=>allPublished.push({id,...m}));
allPublished.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
updateStats();renderPublished();
});
onValue(ref(db,'coming_soon'),snap=>{
allComingSoon=[];
const data=snap.val();
if(data)Object.entries(data).forEach(([id,m])=>allComingSoon.push({id,...m}));
allComingSoon.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
updateStats();renderComingSoon();
});
}

function updateStats(){
const pending=allRequests.filter(r=>r.status==='pending'||!r.status).length;
const published=allPublished.length;
const comingSoon=allComingSoon.length;
const rejected=allRequests.filter(r=>r.status==='rejected').length;
let totalEp=0;
allPublished.forEach(m=>{if(m.episodes)totalEp+=Object.keys(m.episodes).length;else if(m.videoSource)totalEp++});
document.getElementById('statPending').textContent=pending;
document.getElementById('statPublished').textContent=published;
document.getElementById('statComing').textContent=comingSoon;
document.getElementById('statEpisodes').textContent=totalEp;
document.getElementById('statRejected').textContent=rejected;
const badge=document.getElementById('pendingBadge');
if(pending>0){badge.style.display='inline';badge.textContent=pending}else{badge.style.display='none'}
}

const status=r.status||'pending';
const isPending=status==='pending';
const isComing=status==='coming';

if(ct==='series'){if(r.episodeType==='specific')epInfo=`Ep. ${r.specificEpisode||'?'}`;else epInfo=r.season?`Season ${r.season} - Semua Episode`:'Semua Episode'}
else if(ct==='ova'){epInfo=r.season?`Season ${r.season}`:'OVA / Special'}

return`<div class="card">
<div class="card-header">
<div class="card-title">${escH(r.title)}<span class="type-tag ${ct}">${ct}</span></div>
<span class="status-tag ${status}">${status==='pending'?'Pending':status==='published'?'Diterbitkan':status==='coming'?'Sedang Diterbitkan':'Ditolak'}</span>
</div>
<div class="card-meta">
${r.year?`<span class="meta-chip"><i class="fas fa-calendar"></i> ${r.year}</span>`:''}
${epInfo?`<span class="meta-chip"><i class="fas fa-list"></i> ${epInfo}</span>`:''}
<span class="meta-chip"><i class="fas fa-headphones"></i> ${audioSub}</span>
<span class="meta-chip"><i class="fas fa-tv"></i> ${r.resolution||'-'}</span>
</div>
<div class="card-details">
<div><strong>Genre:</strong> ${escH(genres)}</div>
<div><strong>Referensi:</strong> ${refLink}</div>
${r.notes?`<div><strong>Catatan:</strong> ${escH(r.notes)}</div>`:''}
<div style="margin-top:6px;font-size:.75rem;color:var(--text2)"><i class="far fa-clock"></i> ${formatDate(r.requestedAt)}</div>
</div>
${isPending?`<div class="card-footer">
<button class="btn btn-coming" onclick="openPublishModal('${r.id}',true)"><i class="fas fa-clock"></i> Simpan CS</button>
<button class="btn btn-success" onclick="openPublishModal('${r.id}',false)"><i class="fas fa-check"></i> Publikasikan</button>
<button class="btn btn-danger" onclick="rejectRequest('${r.id}')"><i class="fas fa-times"></i> Tolak</button>

${isComing?`<div class="card-footer">
<button class="btn btn-success" onclick="publishFromComing('${r.id}')"><i class="fas fa-upload"></i> Publikasikan Sekarang</button>
<button class="btn btn-danger" onclick="deleteComingRequest('${r.id}')"><i class="fas fa-trash"></i> Hapus</button>
</div>`:''}
</div>`;
}).join('');
}

// PUBLISH MODAL
function openPublishModal(requestId, asComingSoon=false){
document.getElementById('publishModal').classList.add('active');
document.body.style.overflow='hidden';
epFieldCounter=0;
document.getElementById('pubEpList').innerHTML='';
document.getElementById('btnConvertAll').style.display='none';
const vidInput=document.getElementById('pubVideoUrl');
vidInput.style.color='';vidInput.style.borderColor='';vidInput.classList.remove('converted');

const ctInput=document.getElementById('pubType');
const epSec=document.getElementById('pubEpSection');
const vidSec=document.getElementById('pubVideoSection');
const btnComing=document.getElementById('btnComingSoon');
const btnPublish=document.getElementById('btnPublish');

if(requestId){
const r=allRequests.find(x=>x.id===requestId);
if(!r){showToast('Request tidak ditemukan','error');closePublishModal();return}
document.getElementById('publishModalTitle').textContent=asComingSoon?'Setujui & Simpan Coming Soon':'Setujui & Publikasikan';
document.getElementById('pubRequestId').value=requestId;
document.getElementById('pubTitle').value=r.title||'';
ctInput.value=(r.type||'movie').toUpperCase();
document.getElementById('pubYear').value=r.year||'';
document.getElementById('pubRating').value='';
document.getElementById('pubGenre').value=Array.isArray(r.genres)?r.genres.join(', '):(r.genres||'');
document.getElementById('pubPoster').value='';
document.getElementById('pubDesc').value='';
vidInput.value='';

const ct=(r.type||'movie').toLowerCase();
if(ct==='movie'){epSec.style.display='none';vidSec.style.display='block'}
else{
epSec.style.display='block';vidSec.style.display='none';
let epNums=[];
if(r.episodeType==='specific'&&r.specificEpisode)epNums=parseEpisodeNumbers(r.specificEpisode);
document.getElementById('pubEpCount').value=epNums.length||12;
generateEpFields(epNums);
}

if(asComingSoon){btnComing.style.display='inline-flex';btnPublish.style.display='none';}
else{btnComing.style.display='none';btnPublish.style.display='inline-flex';}
}else{
document.getElementById('publishModalTitle').textContent='Publikasi Manual';
document.getElementById('pubRequestId').value='';
document.getElementById('pubTitle').value='';
ctInput.value='MOVIE';
document.getElementById('pubYear').value=new Date().getFullYear();
document.getElementById('pubRating').value='';
document.getElementById('pubGenre').value='';
document.getElementById('pubPoster').value='';
document.getElementById('pubDesc').value='';
vidInput.value='';
epSec.style.display='none';vidSec.style.display='block';
btnComing.style.display='inline-flex';btnPublish.style.display='inline-flex';
}
}
window.openPublishModal=openPublishModal;

function generateEpFields(predefinedNums){
const list=document.getElementById('pubEpList');list.innerHTML='';epFieldCounter=0;
const count=parseInt(document.getElementById('pubEpCount').value)||1;
const nums=predefinedNums&&predefinedNums.length?predefinedNums:Array.from({length:count},(_,i)=>i+1);
document.getElementById('btnConvertAll').style.display='inline-flex';
nums.forEach(n=>addEpField(n));
}
window.generateEpFields=generateEpFields;

function addEpField(num){
const list=document.getElementById('pubEpList');epFieldCounter++;
const n=num||epFieldCounter;
const div=document.createElement('div');div.className='ep-item';
div.innerHTML=`<div class="ep-item-header">
<span class="ep-num">${n}</span>
<input type="text" class="ep-title-input" placeholder="Judul episode (opsional)" value="Episode ${n}">
<button class="ep-remove" onclick="this.closest('.ep-item').remove()" title="Hapus"><i class="fas fa-trash-alt"></i></button>
</div>
<input type="url" class="ep-url" placeholder="https://drive.google.com/file/d/... atau https://www.dropbox.com/...">`;
list.appendChild(div);
}
window.addEpField=addEpField;

function convertAllEpUrls(){
let converted=0,skipped=0;
document.querySelectorAll('#pubEpList .ep-url').forEach(input=>{
if(!input.value.trim()){return}
if(isConverted(input.value)){input.classList.remove('converted');input.classList.add('already-converted');skipped++;return}
input.value=convertVideoUrl(input.value);
input.classList.remove('already-converted');
input.classList.add('converted');
converted++;
});
if(converted)showToast(`${converted} URL dikonversi`);
else if(skipped)showToast(`${skipped} URL sudah dikonversi`);
else showToast('Tidak ada URL untuk dikonversi');
}
window.convertAllEpUrls=convertAllEpUrls;

function convertVideoUrl(){
const input=document.getElementById('pubVideoUrl');
if(!input.value.trim())return;
if(isConverted(input.value)){input.classList.add('converted');showToast('URL sudah dikonversi');return}
input.value=convertVideoUrl(input.value);
input.classList.add('converted');
showToast('URL dikonversi ke format direct link');
}
window.convertVideoUrl=convertVideoUrl;

async function saveAsComingSoon(){
const title=document.getElementById('pubTitle').value.trim();
if(!title){showToast('Judul wajib diisi!','error');return}
const ct=document.getElementById('pubType').value.toLowerCase();
const poster=document.getElementById('pubPoster').value.trim();
const genre=document.getElementById('pubGenre').value;
const year=document.getElementById('pubYear').value;
const desc=document.getElementById('pubDesc').value.trim();
const requestId=document.getElementById('pubRequestId').value;
const btn=document.getElementById('btnComingSoon');
btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Memproses...';

try{
const comingData={title,contentType:ct,poster,genre,year,description:desc,createdAt:Date.now(),status:'coming_soon'};
const newRef=push(ref(db,'coming_soon'));
await set(newRef,comingData);
if(requestId)await update(ref(db,'requests/'+requestId),{status:'coming',comingSoonId:newRef.key,updatedAt:Date.now()});
closePublishModal();
showToast(`"${title}" berhasil disimpan sebagai Coming Soon!`);
}catch(err){console.error(err);showToast('Gagal: '+err.message,'error')}
finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-clock"></i> Simpan Coming Soon'}
}
window.saveAsComingSoon=saveAsComingSoon;

async function publishMovie(){
const title=document.getElementById('pubTitle').value.trim();
if(!title){showToast('Judul wajib diisi!','error');return}
const ct=document.getElementById('pubType').value.toLowerCase();
const poster=document.getElementById('pubPoster').value.trim();
const rating=parseFloat(document.getElementById('pubRating').value)||null;
const genre=document.getElementById('pubGenre').value;
const year=document.getElementById('pubYear').value;
const desc=document.getElementById('pubDesc').value.trim();
const requestId=document.getElementById('pubRequestId').value;
const btn=document.getElementById('btnPublish');
btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Memproses...';

try{
const movieData={title,contentType:ct,poster,genre,year,rating,description:desc,createdAt:Date.now()};
if(ct==='movie'){
const videoUrl=document.getElementById('pubVideoUrl').value.trim();
if(!videoUrl){showToast('URL video wajib diisi!','error');btn.disabled=false;btn.innerHTML='<i class="fas fa-upload"></i> Publikasikan Sekarang';return}
movieData.videoSource=convertVideoUrl(videoUrl);
}else{
const epItems=document.querySelectorAll('#pubEpList .ep-item');
if(!epItems.length){showToast('Tambahkan minimal 1 episode!','error');btn.disabled=false;btn.innerHTML='<i class="fas fa-upload"></i> Publikasikan Sekarang';return}
movieData.episodes={};let hasUrl=false;
epItems.forEach(item=>{
const num=item.querySelector('.ep-num').textContent.trim();
const epTitle=item.querySelector('.ep-title-input').value.trim()||`Episode ${num}`;
const url=item.querySelector('.ep-url').value.trim();
movieData.episodes[num]={title:epTitle,videoSource:url?convertVideoUrl(url):''};
if(url)hasUrl=true;
});
if(!hasUrl){showToast('Minimal 1 episode harus punya URL!','error');btn.disabled=false;btn.innerHTML='<i class="fas fa-upload"></i> Publikasikan Sekarang';return}
}
const newRef=push(ref(db,'movies'));
await set(newRef,movieData);
if(requestId)await update(ref(db,'requests/'+requestId),{status:'published',publishedAt:Date.now(),publishedId:newRef.key});
closePublishModal();
showToast(`"${title}" berhasil dipublikasikan!`);
}catch(err){console.error(err);showToast('Gagal: '+err.message,'error')}
finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-upload"></i> Publikasikan Sekarang'}
}
window.publishMovie=publishMovie;

async function publishComingSoon(comingId){
const m=allComingSoon.find(x=>x.id===comingId);
if(!m){showToast('Data tidak ditemukan','error');return}
if(!confirm(`Publikasikan "${m.title}" sekarang?`))return;

try{
const movieData={
title:m.title,
contentType:m.contentType||'movie',
poster:m.poster||'',
genre:m.genre||'',
year:m.year||'',
description:m.description||'',
createdAt:Date.now()
};
const newRef=push(ref(db,'movies'));
await set(newRef,movieData);
await remove(ref(db,'coming_soon/'+comingId));
showToast(`"${m.title}" berhasil dipublikasikan!`);
}catch(err){console.error(err);showToast('Gagal: '+err.message,'error')}
}
window.publishComingSoon=publishComingSoon;

async function publishFromComing(requestId){
const r=allRequests.find(x=>x.id===requestId);
if(!r || r.status!=='coming'){showToast('Request tidak valid','error');return}
openPublishModal(requestId,false);
}
window.publishFromComing=publishFromComing;

async function deleteComingRequest(id){
if(!confirm('Hapus permintaan ini dari Coming Soon?'))return;
try{
await update(ref(db,'requests/'+id),{status:'rejected'});
showToast('Permintaan dihapus dari Coming Soon');
}catch(err){showToast('Gagal menghapus','error')}
}
window.deleteComingRequest=deleteComingRequest;

// EPISODES MANAGEMENT
function openEpModal(movieId){
const m=allPublished.find(x=>x.id===movieId);
if(!m){showToast('Film tidak ditemukan','error');return}
document.getElementById('epModalTitle').textContent=m.title;
document.getElementById('epModalMovieId').value=movieId;
const list=document.getElementById('epModalList');list.innerHTML='';manageEpCounter=0;
if(m.episodes){
Object.entries(m.episodes).forEach(([num,ep])=>{
manageEpCounter++;
const div=document.createElement('div');div.className='ep-item';div.dataset.epNum=num;
const alreadyConverted=ep.videoSource && (ep.videoSource.includes('googleapis.com') || /[?&]raw=1(?:&|$)/.test(ep.videoSource));
div.innerHTML=`<div class="ep-item-header">
<input type="number" class="ep-num-input" value="${num}" min="1" style="width:50px">
<input type="text" class="ep-title-input" placeholder="Judul episode" value="${escH(ep.title||'')}">
<button class="ep-remove" onclick="this.closest('.ep-item').remove()" title="Hapus"><i class="fas fa-trash-alt"></i></button>
</div>
<input type="url" class="ep-url ${alreadyConverted?'converted':''}" placeholder="https://drive.google.com/file/d/... atau https://www.dropbox.com/..." value="${ep.videoSource||''}">`;
list.appendChild(div);
});
}
document.getElementById('episodesModal').classList.add('active');document.body.style.overflow='hidden';
}
window.openEpModal=openEpModal;

function closeEpModal(){document.getElementById('episodesModal').classList.remove('active');document.body.style.overflow=''}
window.closeEpModal=closeEpModal;

function addManageEpField(){
const list=document.getElementById('epModalList');manageEpCounter++;
const nextNum=list.children.length?Math.max(...[...list.querySelectorAll('.ep-num-input')].map(i=>parseInt(i.value)||0))+1:1;
const div=document.createElement('div');div.className='ep-item';
div.innerHTML=`<div class="ep-item-header">
<input type="number" class="ep-num-input" value="${nextNum}" min="1" style="width:50px">
<input type="text" class="ep-title-input" placeholder="Judul episode">
<button class="ep-remove" onclick="this.closest('.ep-item').remove()" title="Hapus"><i class="fas fa-trash-alt"></i></button>
</div>
<input type="url" class="ep-url" placeholder="https://drive.google.com/file/d/... atau https://www.dropbox.com/...">`;
list.appendChild(div);list.scrollTop=list.scrollHeight;
}
window.addManageEpField=addManageEpField;

function convertAllManageEpUrls(){
let converted=0,skipped=0;
document.querySelectorAll('#epModalList .ep-url').forEach(input=>{
if(!input.value.trim()){return}
if(isConverted(input.value)){input.classList.remove('converted');input.classList.add('already-converted');skipped++;return}
input.value=convertVideoUrl(input.value);
input.classList.remove('already-converted');
input.classList.add('converted');
converted++;
});
if(converted)showToast(`${converted} URL dikonversi`);
else if(skipped)showToast(`${skipped} URL sudah dikonversi`);
else showToast('Tidak ada URL untuk dikonversi');
}
window.convertAllManageEpUrls=convertAllManageEpUrls;

async function saveEpisodes(){
const movieId=document.getElementById('epModalMovieId').value;
const epItems=document.querySelectorAll('#epModalList .ep-item');
if(!epItems.length){showToast('Tidak ada episode!','error');return}
const btn=event.target;btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
try{
const episodes={};
epItems.forEach(item=>{
const num=item.querySelector('.ep-num-input').value.trim();
const title=item.querySelector('.ep-title-input').value.trim();
const url=item.querySelector('.ep-url').value.trim();
if(num)episodes[num]={title:title||`Episode ${num}`,videoSource:url?convertVideoUrl(url):''};
});
await update(ref(db,'movies/'+movieId+'/episodes'),episodes);
closeEpModal();showToast('Episode berhasil diperbarui!');
}catch(err){console.error(err);showToast('Gagal menyimpan: '+err.message,'error')}
finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> Simpan Perubahan'}
}
window.saveEpisodes=saveEpisodes;

async function deleteMovie(id,title){
if(!confirm(`Hapus "${title}"?\n\nTindakan ini tidak dapat dibatalkan!`))return;
try{await remove(ref(db,'movies/'+id));showToast(`"${title}" telah dihapus`)}
catch(err){console.error(err);showToast('Gagal menghapus','error')}
}
window.deleteMovie=deleteMovie;

// COMING SOON MANAGEMENT
function openComingSoonModal(){
document.getElementById('comingSoonModal').classList.add('active');
document.body.style.overflow='hidden';
document.getElementById('csTitle').value='';
document.getElementById('csType').value='movie';
document.getElementById('csYear').value=new Date().getFullYear();
document.getElementById('csGenre').value='';
document.getElementById('csPoster').value='';
document.getElementById('csDesc').value='';
document.getElementById('csReleaseDate').value='';
}
window.openComingSoonModal=openComingSoonModal;

function closeComingSoonModal(){
document.getElementById('comingSoonModal').classList.remove('active');
document.body.style.overflow='';
}
window.closeComingSoonModal=closeComingSoonModal;

async function saveComingSoon(){
const title=document.getElementById('csTitle').value.trim();
if(!title){showToast('Judul wajib diisi!','error');return}
const data={
title,
contentType:document.getElementById('csType').value,
year:document.getElementById('csYear').value||null,
genre:document.getElementById('csGenre').value||'',
poster:document.getElementById('csPoster').value.trim(),
description:document.getElementById('csDesc').value.trim(),
releaseDate:document.getElementById('csReleaseDate').value||null,
createdAt:Date.now(),
status:'coming_soon'
};
try{
await push(ref(db,'coming_soon'),data);
closeComingSoonModal();
showToast(`"${title}" ditambahkan ke Coming Soon!`);
}catch(err){showToast('Gagal menyimpan: '+err.message,'error')}
}
window.saveComingSoon=saveComingSoon;

async function deleteComingSoon(id,title){
if(!confirm(`Hapus "${title}" dari Coming Soon?`))return;
try{
await remove(ref(db,'coming_soon/'+id));
showToast(`"${title}" dihapus dari Coming Soon`);
}catch(err){showToast('Gagal menghapus','error')}
}
window.deleteComingSoon=deleteComingSoon;

// Manual publish button
document.getElementById('btnManualPublish').addEventListener('click',()=>openPublishModal(null,false));

// Modal close on backdrop click
document.querySelectorAll('.modal-overlay').forEach(ov=>{
ov.addEventListener('click',e=>{if(e.target===ov){ov.classList.remove('active');document.body.style.overflow=''}});
});

loadAllData();
</script>
