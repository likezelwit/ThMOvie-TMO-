<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTMO - Dashboard Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#f0f2f8;--surface:#ffffff;--card:#ffffff;--border:#e2e6f0;--text:#1a1d2e;--text2:#6b7294;
            --accent:#2563eb;--accent-light:#dbeafe;--success:#16a34a;--success-light:#dcfce7;
            --warn:#ea580c;--warn-light:#fff7ed;--danger:#dc2626;--danger-light:#fee2e2;
            --purple:#7c3aed;--purple-light:#ede9fe;--radius:14px;
            --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
            --shadow-lg:0 4px 16px rgba(0,0,0,.08);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;min-height:100vh;overflow-x:hidden}
        ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c7cce0;border-radius:3px}

        .sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s;box-shadow:2px 0 8px rgba(0,0,0,.04)}
        .sidebar-logo{padding:22px 24px;font-size:1.5rem;font-weight:900;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#eff6ff,#fff)}
        .sidebar-logo i{color:var(--accent)}.sidebar-logo span{color:var(--accent)}
        .sidebar-nav{flex:1;padding:14px;display:flex;flex-direction:column;gap:4px}
        .sidebar-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:10px;color:var(--text2);cursor:pointer;transition:.2s;font-weight:600;font-size:.88rem;position:relative;text-decoration:none}
        .sidebar-item:hover{background:var(--accent-light);color:var(--accent)}
        .sidebar-item.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
        .sidebar-badge{background:var(--danger);color:#fff;font-size:.62rem;padding:2px 7px;border-radius:10px;min-width:20px;text-align:center;font-weight:800}
        .sidebar-footer{padding:14px;border-top:1px solid var(--border)}

        .main{margin-left:260px;flex:1;min-height:100vh;display:flex;flex-direction:column}
        .top-bar{padding:14px 28px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
        .hamburger{display:none;background:none;border:1px solid var(--border);color:var(--text);font-size:1.1rem;cursor:pointer;padding:6px 10px;border-radius:8px}
        .hamburger:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
        .top-bar h1{font-size:1.15rem;font-weight:800;flex:1}
        .top-actions{display:flex;gap:8px}
        .content-body{padding:28px;flex:1}

        .section{display:none;animation:fadeIn .3s ease}
        .section.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:28px}
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;align-items:center;gap:16px;transition:.25s;box-shadow:var(--shadow)}
        .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
        .stat-icon{width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
        .stat-icon.blue{background:var(--accent-light);color:var(--accent)}.stat-icon.orange{background:var(--warn-light);color:var(--warn)}.stat-icon.green{background:var(--success-light);color:var(--success)}.stat-icon.purple{background:var(--purple-light);color:var(--purple)}
        .stat-num{font-size:1.7rem;font-weight:800;line-height:1}.stat-label{font-size:.8rem;color:var(--text2);margin-top:2px}

        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;transition:.2s;box-shadow:var(--shadow)}
        .card:hover{box-shadow:var(--shadow-lg)}
        .card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
        .card-title{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--text)}
        .type-tag{font-size:.6rem;font-weight:800;padding:3px 9px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
        .type-tag.movie{background:var(--accent-light);color:var(--accent)}.type-tag.series{background:var(--warn-light);color:var(--warn)}.type-tag.ova{background:var(--purple-light);color:var(--purple)}
        .status-tag{font-size:.65rem;font-weight:700;padding:4px 12px;border-radius:20px;flex-shrink:0}
        .status-tag.pending{background:var(--warn-light);color:var(--warn)}.status-tag.published{background:var(--success-light);color:var(--success)}.status-tag.coming_soon{background:var(--purple-light);color:var(--purple)}.status-tag.rejected{background:var(--danger-light);color:var(--danger)}
        .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
        .meta-chip{font-size:.73rem;color:var(--text2);background:var(--bg);padding:4px 10px;border-radius:6px;font-weight:500}
        .card-details{font-size:.84rem;color:var(--text2);line-height:1.7;margin-bottom:14px}
        .card-details strong{color:var(--text);font-weight:600}
        .card-footer{display:flex;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border)}

        .btn{border:none;padding:9px 18px;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s;font-family:'Inter',sans-serif;font-size:.82rem;display:inline-flex;align-items:center;gap:6px}
        .btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#1d4ed8;box-shadow:0 2px 8px rgba(37,99,235,.3)}
        .btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#15803d;box-shadow:0 2px 8px rgba(22,163,74,.3)}
        .btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c;box-shadow:0 2px 8px rgba(220,38,38,.3)}
        .btn-warn{background:var(--warn);color:#fff}.btn-warn:hover{background:#c2410c;box-shadow:0 2px 8px rgba(234,88,12,.3)}
        .btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#6d28d9;box-shadow:0 2px 8px rgba(124,58,237,.3)}
        .btn-ghost{background:var(--surface);color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{border-color:var(--text2);color:var(--text);background:var(--bg)}
        .btn-sm{padding:6px 12px;font-size:.75rem;border-radius:6px}.btn-lg{padding:12px 28px;font-size:.95rem;border-radius:10px}
        .btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}

        .form-group{margin-bottom:18px}
        .form-label{display:block;font-weight:600;margin-bottom:6px;font-size:.85rem;color:var(--text)}
        .form-input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);outline:none;font-size:.9rem;font-family:'Inter',sans-serif;transition:.2s}
        .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
        .form-input[readonly]{background:var(--bg);color:var(--text2)}
        textarea.form-input{min-height:80px;resize:vertical;font-family:'JetBrains Mono',monospace;font-size:.82rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

        .ep-list{max-height:400px;overflow-y:auto;padding-right:4px}
        .ep-item{background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px}
        .ep-item-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .ep-num{width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex-shrink:0}
        .ep-num-input{width:52px;padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);text-align:center;font-weight:700;font-size:.85rem;font-family:'JetBrains Mono',monospace}
        .ep-title-input{flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:.85rem;outline:none}
        .ep-title-input:focus{border-color:var(--accent)}
        .ep-remove{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px 6px;border-radius:4px;font-size:.85rem;transition:.2s}
        .ep-remove:hover{color:var(--danger);background:var(--danger-light)}
        .ep-url{font-family:'JetBrains Mono',monospace;font-size:.76rem;width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text2);outline:none}
        .ep-url:focus{border-color:var(--accent)}
        .ep-url.converted{color:var(--success)!important;border-color:var(--success)!important;background:var(--success-light)!important}
        .add-ep-btn{width:100%;padding:12px;border:2px dashed var(--border);border-radius:10px;background:transparent;color:var(--text2);cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s;font-family:'Inter',sans-serif}
        .add-ep-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;opacity:0;pointer-events:none;transition:opacity .3s;overflow-y:auto}
        .modal-overlay.active{opacity:1;pointer-events:all}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:680px;transform:translateY(20px) scale(.97);transition:transform .35s cubic-bezier(.175,.885,.32,1.275);margin-bottom:40px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
        .modal-overlay.active .modal{transform:translateY(0) scale(1)}
        .modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2;border-radius:18px 18px 0 0}
        .modal-head h3{font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--text)}
        .modal-close{background:none;border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:6px;transition:.2s}
        .modal-close:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-light)}
        .modal-body{padding:24px}
        .modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 18px 18px}
        .modal-divider{border:none;border-top:1px solid var(--border);margin:20px 0}

        .empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
        .empty-state i{font-size:3rem;color:var(--border);margin-bottom:14px;display:block}
        .empty-state h3{font-size:1.1rem;color:var(--text);margin-bottom:6px}

        .filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
        .filter-btn{padding:7px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-weight:600;font-size:.8rem;transition:.2s;font-family:'Inter',sans-serif}
        .filter-btn:hover{border-color:var(--text2);color:var(--text)}
        .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(37,99,235,.25)}

        .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
        .toast{background:var(--surface);color:var(--text);padding:14px 20px;border-radius:12px;font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.12);border-left:4px solid var(--success);pointer-events:auto;transform:translateX(120%);transition:transform .4s cubic-bezier(.175,.885,.32,1.275);max-width:380px;display:flex;align-items:center;gap:10px}
        .toast.show{transform:translateX(0)}.toast.error{border-left-color:var(--danger)}.toast i{font-size:1.1rem;flex-shrink:0}

        .pub-card{display:flex;gap:16px;align-items:flex-start}
        .pub-poster{width:80px;height:120px;border-radius:10px;overflow:hidden;flex-shrink:0;background:var(--border)}
        .pub-poster img{width:100%;height:100%;object-fit:cover}
        .pub-info{flex:1;min-width:0}
        .pub-title{font-weight:800;font-size:1rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .pub-meta{font-size:.8rem;color:var(--text2);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
        .pub-ep-count{display:inline-flex;align-items:center;gap:4px;font-size:.73rem;color:var(--warn);background:var(--warn-light);padding:3px 10px;border-radius:5px;font-weight:700}
        .pub-ep-count.ok{color:var(--success);background:var(--success-light)}

        @media(max-width:768px){
            .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:99;display:none}.sidebar-backdrop.show{display:block}.main{margin-left:0}.hamburger{display:block}.content-body{padding:16px}.stats-grid{grid-template-columns:1fr 1fr}.form-row{grid-template-columns:1fr}.pub-card{flex-direction:column;align-items:center;text-align:center}.pub-poster{width:100px;height:150px}.modal{max-width:100%}.modal-overlay{padding:16px}
        }
        @media(max-width:480px){.stats-grid{grid-template-columns:1fr}.card-footer{flex-direction:column}.card-footer .btn{width:100%;justify-content:center}}
    </style>
<base target="_blank">
</head>
<body>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><i class="fas fa-play-circle"></i> DTMO <span>Admin</span></div>
    <nav class="sidebar-nav">
        <a class="sidebar-item active" data-section="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a class="sidebar-item" data-section="requests"><i class="fas fa-inbox"></i> Permintaan <span class="sidebar-badge" id="pendingBadge" style="display:none">0</span></a>
        <a class="sidebar-item" data-section="published"><i class="fas fa-film"></i> Film Terbit</a>
    </nav>
    <div class="sidebar-footer">
        <a class="sidebar-item" href="../index.html"><i class="fas fa-external-link-alt"></i> Ke Website</a>
    </div>
</aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="main">
    <header class="top-bar">
        <button class="hamburger" id="hamburger"><i class="fas fa-bars"></i></button>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="top-actions">
            <button class="btn btn-primary btn-sm" id="btnManualPublish"><i class="fas fa-plus"></i> Publikasi Manual</button>
        </div>
    </header>

    <div class="content-body">
        <section id="sec-dashboard" class="section active">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-inbox"></i></div><div><div class="stat-num" id="statPending">0</div><div class="stat-label">Permintaan Pending</div></div></div>
                <div class="stat-card"><div class="stat-icon green"><i class="fas fa-check-circle"></i></div><div><div class="stat-num" id="statPublished">0</div><div class="stat-label">Film Terbit</div></div></div>
                <div class="stat-card"><div class="stat-icon purple"><i class="fas fa-clock"></i></div><div><div class="stat-num" id="statComingSoon">0</div><div class="stat-label">Coming Soon</div></div></div>
                <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-list-ol"></i></div><div><div class="stat-num" id="statEpisodes">0</div><div class="stat-label">Total Episode</div></div></div>
            </div>
            <h3 style="font-size:1rem;font-weight:800;margin-bottom:14px;color:var(--warn)"><i class="fas fa-clock" style="margin-right:6px"></i>Permintaan Terbaru</h3>
            <div id="recentRequests"></div>
        </section>

        <section id="sec-requests" class="section">
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="coming_soon">Coming Soon</button>
                <button class="filter-btn" data-filter="published">Diterbitkan</button>
                <button class="filter-btn" data-filter="rejected">Ditolak</button>
                <button class="filter-btn" data-filter="all">Semua</button>
            </div>
            <div id="requestsList"></div>
        </section>

        <section id="sec-published" class="section">
            <div id="publishedList"></div>
        </section>
    </div>
</div>

<div class="modal-overlay" id="publishModal">
    <div class="modal">
        <div class="modal-head">
            <h3><i class="fas fa-upload" style="color:var(--accent)"></i> <span id="publishModalTitle">Publikasikan Film</span></h3>
            <button class="modal-close" onclick="closePublishModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="pubRequestId">
            <div class="form-row">
                <div class="form-group"><label class="form-label">Judul</label><input type="text" class="form-input" id="pubTitle" readonly></div>
                <div class="form-group"><label class="form-label">Tipe</label><select class="form-input" id="pubType" onchange="onPubTypeChange()" style="text-transform:uppercase;font-weight:700;letter-spacing:1px">
                        <option value="MOVIE">MOVIE</option>
                        <option value="SERIES">SERIES</option>
                        <option value="OVA">OVA</option>
                    </select></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label class="form-label">Tahun Rilis</label><input type="text" class="form-input" id="pubYear" readonly></div>
                <div class="form-group"><label class="form-label">Rating / 10</label><input type="text" class="form-input" id="pubRating" placeholder="8.5 atau 9,2" pattern="^[0-9]{1,2}([.,][0-9])?$" title="Format: 8.5 atau 9,2"></div>
            </div>
            <div class="form-group"><label class="form-label">Genre</label><input type="text" class="form-input" id="pubGenre" readonly></div>
            <div class="form-group"><label class="form-label">URL Poster</label><input type="url" class="form-input" id="pubPoster" placeholder="https://..."></div>
            <div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-input" id="pubDesc" placeholder="Sinopsis atau deskripsi singkat..." style="font-family:'Inter',sans-serif;font-size:.9rem"></textarea></div>
            
            <div id="pubVideoSection" style="display:block">
                <hr class="modal-divider">
                <div class="form-group"><label class="form-label">Embed Code (Streamtape/Google Drive)</label>
                    <textarea class="form-input" id="pubVideoCode" placeholder='<iframe src="https://streamtape.com/e/..." ...></iframe>' style="height:120px;font-family:'JetBrains Mono',monospace;font-size:.8rem"></textarea>
                    <small style="color:var(--text2);display:block;margin-top:4px">Tempel kode <code>&lt;iframe&gt;</code> lengkap di sini. Kami akan menambahkan <code>?api=1</code> otomatis jika memungkinkan.</small>
                </div>
            </div>

            <div id="pubEpSection" style="display:none">
                <hr class="modal-divider">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
                    <h4 style="font-size:.95rem;font-weight:800;display:flex;align-items:center;gap:6px;color:var(--warn)"><i class="fas fa-list-ol"></i> Episode</h4>
                    <div style="display:flex;gap:8px;align-items:center">
                        <label class="form-label" style="margin:0;white-space:nowrap">Jumlah:</label>
                        <input type="number" class="form-input" id="pubEpCount" style="width:70px;padding:6px 10px;text-align:center" min="1" value="1">
                        <button class="btn btn-ghost btn-sm" onclick="generateEpFields()"><i class="fas fa-sync-alt"></i> Generate</button>
                    </div>
                </div>
                <div class="ep-list" id="pubEpList"></div>
                <button class="add-ep-btn" onclick="addEpField()"><i class="fas fa-plus"></i> Tambah Episode</button>
                <div style="margin-top:12px;text-align:right">
                    <button class="btn btn-ghost btn-sm" onclick="processAllEpCodes()" id="btnProcessAll" style="display:none"><i class="fas fa-magic"></i> Proses Semua Kode</button>
                </div>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" onclick="closePublishModal()">Batal</button>
            <button class="btn btn-purple btn-lg" id="btnPublishSoon" onclick="publishMovie('coming_soon')"><i class="fas fa-clock"></i> Coming Soon</button>
            <button class="btn btn-success btn-lg" id="btnPublish" onclick="publishMovie('published')"><i class="fas fa-upload"></i> Terbitkan Sekarang</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="episodesModal">
    <div class="modal">
        <div class="modal-head">
            <h3><i class="fas fa-list-ol" style="color:var(--warn)"></i> Kelola Episode — <span id="epModalTitle">...</span></h3>
            <button class="modal-close" onclick="closeEpModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="epModalMovieId">
            <div class="ep-list" id="epModalList"></div>
            <button class="add-ep-btn" onclick="addManageEpField()" style="margin-top:10px"><i class="fas fa-plus"></i> Tambah Episode Baru</button>
        </div>
        <div class="modal-foot">
            <button class="btn btn-ghost" onclick="closeEpModal()">Batal</button>

// === LOGIKA EMBED CODE (Streamtape/Dropbox) ===
function processEmbedCode(code){
    if(!code) return '';
    code = code.trim();

    // Helper: fix trailing slash before query params for Streamtape
    function fixStreamtapeUrl(url){
        // Remove trailing slash before adding query param
        url = url.replace(/\/$/, '');
        if(url.includes('streamtape.com') && !url.includes('api=1')){
            url += (url.includes('?') ? '&api=1' : '?api=1');
        }
        return url;
    }

    // Jika input berupa URL mentah (bukan iframe), coba apakah itu dropbox
    if(!code.startsWith('<iframe') && !code.startsWith('<div')){
        if(code.includes('dropbox.com')){
            // Logika Dropbox lama dipertahankan
            let url = code.replace(/[?&]dl=[^&]*/g, '').replace(/[?&]raw=0[^&]*/g, '');
            url = url.replace(/\?&/g, '?').replace(/&&/g, '&').replace(/[?&]$/, '');
            if(!/[?&]raw=1(?:&|$)/.test(url)) url += (url.includes('?')?'&raw=1':'?raw=1');
            return url; // Kembalikan URL murni untuk tag <video>
        }
        // Jika URL lain (misal streamtape tanpa tag), coba buat iframe standar
        if(code.includes('streamtape.com')){
             const fixedUrl = fixStreamtapeUrl(code);
             return `<iframe src="${fixedUrl}" width="100%" height="100%" allowfullscreen allowtransparency allow="autoplay" scrolling="no" frameborder="0"></iframe>`;
        }
        return code;
    }

    // Jika sudah berupa tag HTML (Iframe)
    // 1. Cari src
    const srcMatch = code.match(/src=["']([^"']+)["']/);
    if(srcMatch){
        let src = srcMatch[1];
        // 2. Fix trailing slash dan tambahkan ?api=1 jika belum ada dan jika streamtape
        if(src.includes('streamtape.com') && !src.includes('api=1')){
            src = fixStreamtapeUrl(src);
            code = code.replace(/src=["'][^"']+["']/, `src="${src}"`);
        }
    }
    return code;
}

    // Jika sudah berupa tag HTML (Iframe)
    // 1. Cari src
    const srcMatch = code.match(/src=["']([^"']+)["']/);
    if(srcMatch){
        let src = srcMatch[1];
        // 2. Tambahkan ?api=1 jika belum ada dan jika streamtape
        if(src.includes('streamtape.com') && !src.includes('api=1')){
            src += (src.includes('?') ? '&api=1' : '?api=1');
            code = code.replace(/src=["'][^"']+["']/, `src="${src}"`);
        }
    }
    return code;
}

function parseEpisodeNumbers(text){
    if(!text)return[];
    const nums=new Set();
    text.split(',').forEach(p=>{p=p.trim();if(p.includes('-')){const[a,b]=p.split('-').map(Number);for(let i=a;i<=b;i++)nums.add(i)}else{const n=parseInt(p);if(!isNaN(n))nums.add(n)}});
    return[...nums].sort((a,b)=>a-b);
}

async function publishMovie(targetStatus){
    const title=document.getElementById('pubTitle').value.trim();
    if(!title){showToast('Judul wajib diisi!','error');return}
    const ct=document.getElementById('pubType').value.toLowerCase();
    const poster=document.getElementById('pubPoster').value.trim();
    const ratingRaw=document.getElementById('pubRating').value.trim().replace(',','.');const rating=parseFloat(ratingRaw)||null;
    const genre=document.getElementById('pubGenre').value;
    const year=document.getElementById('pubYear').value;
    const desc=document.getElementById('pubDesc').value.trim();
    const resolution=document.getElementById('pubResolution')?.value||'720p';
    const audioSub=document.getElementById('pubAudioSub')?.value?.trim()||null;
    const requestId=document.getElementById('pubRequestId').value;
    
    const btn=targetStatus==='published'?document.getElementById('btnPublish'):document.getElementById('btnPublishSoon');
    btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Memproses...';

    try{
        const movieData={title,contentType:ct,poster,genre,year,rating,description:desc,resolution,audioSub,createdAt:Date.now(), status: targetStatus};
        
        if(ct==='movie'){
            const code=document.getElementById('pubVideoCode').value.trim();
            if(!code){showToast('Kode Embed/URL wajib diisi!','error');btn.disabled=false;btn.innerHTML='Terbitkan';return}
            movieData.videoSource=processEmbedCode(code);
        }else{
            const epItems=document.querySelectorAll('#pubEpList .ep-item');
            if(!epItems.length){showToast('Tambahkan minimal 1 episode!','error');btn.disabled=false;btn.innerHTML='Terbitkan';return}
            movieData.episodes={};let hasContent=false;
            epItems.forEach(item=>{
                const num=item.querySelector('.ep-num').textContent.trim();
                const epTitle=item.querySelector('.ep-title-input').value.trim()||`Episode ${num}`;
                const code=item.querySelector('.ep-url').value.trim();
                const processedCode = code ? processEmbedCode(code) : '';
                movieData.episodes[num]={title:epTitle,videoSource:processedCode};
                if(code)hasContent=true;
            });
            if(!hasContent){showToast('Minimal 1 episode harus punya kode!','error');btn.disabled=false;btn.innerHTML='Terbitkan';return}
        }
        
        const newRef=push(ref(db,'movies'));
        await set(newRef,movieData);
        
        if(requestId){
            await update(ref(db,'requests/'+requestId),{
                status: targetStatus, 
                publishedAt:Date.now(), 
                publishedId:newRef.key
            });
        }
        
        closePublishModal();
        const msg = targetStatus === 'coming_soon' ? 'Dipindahkan ke Coming Soon!' : 'Berhasil diterbitkan!';
        showToast(msg);
    }catch(err){console.error(err);showToast('Gagal: '+err.message,'error')}
    finally{btn.disabled=false;btn.innerHTML=targetStatus==='coming_soon'?'<i class="fas fa-clock"></i> Coming Soon':'<i class="fas fa-upload"></i> Terbitkan Sekarang'}
}
window.publishMovie=publishMovie;

        <input type="number" class="ep-num-input" value="${nextNum}" min="1" style="width:50px">
        <input type="text" class="ep-title-input" placeholder="Judul episode">
        <button class="ep-remove" onclick="this.closest('.ep-item').remove()" title="Hapus"><i class="fas fa-trash-alt"></i></button>
    </div>
    <textarea class="ep-url" placeholder="Embed Code atau Link" rows="3"></textarea>`;
    list.appendChild(div);list.scrollTop=list.scrollHeight;
}
window.addManageEpField=addManageEpField;

async function saveEpisodes(){
    const movieId=document.getElementById('epModalMovieId').value;
    const epItems=document.querySelectorAll('#epModalList .ep-item');
    if(!epItems.length){showToast('Tidak ada episode!','error');return}
    const btn=event.target;btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
    try{
        const episodes={};
        epItems.forEach(item=>{
            const num=item.querySelector('.ep-num-input').value.trim();
            const title=item.querySelector('.ep-title-input').value.trim();
            const code=item.querySelector('.ep-url').value.trim();
            if(num)episodes[num]={title:title||`Episode ${num}`,videoSource:code?processEmbedCode(code):''};
        });
        await update(ref(db,'movies/'+movieId+'/episodes'),episodes);
        closeEpModal();showToast('Episode berhasil diperbarui!');
    }catch(err){console.error(err);showToast('Gagal menyimpan: '+err.message,'error')}
    finally{btn.disabled=false;btn.innerHTML='<i class="fas fa-save"></i> Simpan Perubahan'}
}

function deleteEpisode(movieId, epNum){
    if(!confirm(`Hapus Episode ${epNum}?`))return;
    remove(ref(db,'movies/'+movieId+'/episodes/'+epNum)).then(()=>{
        showToast(`Episode ${epNum} dihapus`);
        // Refresh modal
        const m=allPublished.find(x=>x.id===movieId);
        if(m) openEpModal(movieId);
    }).catch(()=>showToast('Gagal menghapus episode','error'));
}
window.deleteEpisode=deleteEpisode;
window.saveEpisodes=saveEpisodes;

async function deleteMovie(id,title){
    if(!confirm(`Hapus "${title}"?\n\nTindakan ini tidak dapat dibatalkan!`))return;
    try{await remove(ref(db,'movies/'+id));showToast(`"${title}" telah dihapus`)}
    catch(err){console.error(err);showToast('Gagal menghapus','error')}
}
window.deleteMovie=deleteMovie;

document.getElementById('btnManualPublish').addEventListener('click',()=>openPublishModal(null));
document.querySelectorAll('.modal-overlay').forEach(ov=>{
    ov.addEventListener('click',e=>{if(e.target===ov){ov.classList.remove('active');document.body.style.overflow=''}});
});

loadAllData();
</script>
</body>
</html>
