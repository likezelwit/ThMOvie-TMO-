<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThMovie - Player Premium</title>
    <style>
        body {
            background-color: #0d0d13;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .video-wrapper {
            width: 90%;
            max-width: 850px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        /* Membuat container video responsive 16:9 agar pas di layar PC atau HP */
        .iframe-container {
            position: relative;
            padding-bottom: 56.25%; /* Rasio 16:9 */
            height: 0;
            overflow: hidden;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

<div class="video-wrapper">
    <div class="iframe-container">
        <!-- Menggunakan ID file 1qJ26IK0GYZD4G0tdluOpFyLhSHsWCn0q dengan jalur /preview resmi Google -->
        <iframe 
            src="https://drive.google.com/file/d/1qJ26IK0GYZD4G0tdluOpFyLhSHsWCn0q/preview" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>
</div>

</body>
</html>
