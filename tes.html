<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Bioskop Streamtape Tanpa Firebase</title>
    <style>
        body { background: #0b0c10; color: white; font-family: sans-serif; text-align: center; padding-top: 30px; }
        .cinema-box { width: 90%; max-width: 700px; margin: 0 auto; position: relative; aspect-ratio: 16/9; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        /* Kunci Bioskop: Mengunci klik di dalam layar video */
        .blocker { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 45px); background: transparent; z-index: 5; }
        .panel-tes { margin-top: 20px; background: #1f2833; padding: 15px; display: inline-block; border-radius: 8px; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; margin: 5px; border: none; border-radius: 4px; }
        .btn-action { background: #66fcf1; color: black; }
        .btn-simulasi { background: #c5a059; color: white; }
    </style>
</head>
<body>

    <h2>🎬 Simulasi Studio Bioskop Streamtape</h2>
    
    <div class="cinema-box">
        <div class="blocker"></div>
        <!-- Menggunakan link video embed Streamtape milik Anda -->
        <iframe id="tapePlayer" src="https://streamtape.com" allow="autoplay"></iframe>
    </div>
    
    <div class="panel-tes">
        <h3>🛠️ PANEL SIMULASI PENONTON</h3>
        <p>Pilih skenario kedatangan Anda terlebih dahulu:</p>
        <button class="btn-simulasi" id="setTepatWaktu">1. Atur: Saya Datang Tepat Waktu</button>
        <button class="btn-simulasi" id="setTelat5Menit">2. Atur: Saya Telat 5 Menit</button>
        <hr style="border-color: #45f3ff;">
        <button class="btn-action" id="tombolKlik">🍿 MASUK BIOSKOP / SINKRONKAN DETIK</button>
    </div>

    <p id="info-status">Silakan pilih skenario penonton di atas...</p>

    <script>
        const iframe = document.getElementById('tapePlayer');
        const info = document.getElementById('info-status');
        
        // Variabel penampung waktu mulai film fiktif untuk uji coba
        let waktuMulaiFilm = 0; 

        // Fungsi kirim perintah jarak jauh ke dalam Iframe Streamtape
        function kontrolStreamtape(perintah, nilai = null) {
            if (iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify({
                    'event': perintah, 'value': nilai
                }), '*');
            }
        }

        // TOMBOL SIMULASI 1: Berpura-pura film baru mau mulai 10 detik lagi
        document.getElementById('setTepatWaktu').addEventListener('click', () => {
            waktuMulaiFilm = Date.now() + 10000; // Waktu sekarang ditambah 10 detik
            info.innerText = "Skenario diatur: Film akan dimulai dalam 10 detik lagi. Silakan klik tombol masuk.";
        });

        // TOMBOL SIMULASI 2: Berpura-pura film sudah jalan 5 menit yang lalu (300 detik)
        document.getElementById('setTelat5Menit').addEventListener('click', () => {
            waktuMulaiFilm = Date.now() - 300000; // Waktu sekarang dikurangi 5 menit
            info.innerText = "Skenario diatur: Film sudah jalan 5 menit. Silakan klik tombol masuk untuk tes lompat detik.";
        });

        // TOMBOL UTAMA: Menerima interaksi klik user untuk sinkronisasi durasi
        document.getElementById('tombolKlik').addEventListener('click', () => {
            if (waktuMulaiFilm === 0) {
                return alert("Pilih skenario kedatangan kamu dulu (Tombol 1 atau Tombol 2)!");
            }

            const waktuSekarang = Date.now();
            const selisihDetik = Math.floor((waktuSekarang - waktuMulaiFilm) / 1000);

            if (selisihDetik > 0) {
                // Eksekusi Skenario Telat: Otomatis memaksa video Streamtape melompat maju
                info.innerText = `Menyelaraskan durasi... Kamu telat ${Math.floor(selisihDetik/60)}m ${selisihDetik%60}s.`;
                kontrolStreamtape('seek', selisihDetik);
                kontrolStreamtape('play');
            } else {
                // Eksekusi Skenario Tepat Waktu: Mengunci video di detik 0 sampai hitung mundur habis
                info.innerText = "Berhasil masuk studio! Menunggu hitung mundur di kursi...";
                kontrolStreamtape('seek', 0);
                kontrolStreamtape('pause');
            }
        });

        // Detak jam otomatis setiap 1 detik untuk menghitung mundur atau menyalakan video
        setInterval(() => {
            if (waktuMulaiFilm > 0) {
                const waktuSekarang = Date.now();
                const selisihDetik = Math.floor((waktuSekarang - waktuMulaiFilm) / 1000);

                if (selisihDetik === 0) {
                    info.innerText = "Waktu lobi habis! PROYEKTOR BIOSKOP MULAI BERJALAN!";
                    kontrolStreamtape('seek', 0);
                    kontrolStreamtape('play');
                } else if (selisihDetik < 0) {
                    const sisa = Math.abs(selisihDetik);
                    info.innerText = `Menunggu waktu siaran: Film dimulai dalam ${Math.floor(sisa/60)}m ${sisa%60}s lagi.`;
                }
            }
        }, 1000);
    </script>
</body>
</html>
