<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThMovie - Dropbox Real-time Sync</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { 
            background-color: #0f0f0f !important; 
            color: white !important; 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        .cinema-header { 
            margin-bottom: 25px; 
        }
        .vowviw-container { 
            position: relative; 
            width: 100%; 
            max-width: 900px; 
            margin: 0 auto; 
            padding-bottom: 56.25%; 
            height: 0; 
            background: #000; 
            border-radius: 12px; 
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.3); 
            overflow: hidden; 
            border: 2px solid #222; 
        }
        video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            outline: none; 
        }
        .footer { 
            margin-top: 30px; 
            font-size: 13px; 
            color: #666; 
        }
    </style>
</head>
<body>

    <div class="cinema-header">
        <h1>🎬 ThMovie (TMO)</h1>
        <p>Streaming via Dropbox - Real-time Mode</p>
    </div>

    <div class="vowviw-container">
        <video id="tmo-player" controls>
            <source src="https://www.dropbox.com/scl/fi/c2gb5n9r9pep1gsdo6z82/Attack-On-Titan-High-School-Shingeki-Kyojin-chuugakkou-eps-1-indonesia-sub-Bstation.mp4?rlkey=0cg5yqmy35616hjsh0ykycf2m&st=xj3do6k4&raw=1" type="video/mp4">
            Browser lo gak support tag video.
        </video>
    </div>

    <div class="footer">
        <p>&copy; 2026 ThMovie Production by Gilang - Kelas VI A</p>
    </div>

    <script>
        const ably = new Ably.Realtime('4PuneA.m9z7NA:9tNxlKi-0-BnCULHgl54eS8A7agg3ivOQMiVisCncCI');
        const channel = ably.channels.get('tmo-nobar');
        const video = document.getElementById('tmo-player');

        const myClientId = 'user_' + Math.random().toString(36).substr(2, 9);
        let isReceiving = false;
        let isHost = false;

        // Ambil data kehadiran (Presence) di room Ably
        channel.presence.enter(myClientId);
        channel.presence.get((err, members) => {
            if (!err && members.length === 1) {
                // Jika cuma ada 1 orang di room, berarti dia adalah Host pertama
                isHost = true;
                console.log("Kamu adalah Host utama room ini.");
            } else {
                // Jika ada orang lain, minta data detik terbaru dari penonton lama
                setTimeout(() => {
                    channel.publish('request-status', { from: myClientId });
                }, 1000);
            }
        });

        // Deteksi aksi penonton
        video.onplay = () => { 
            if (!isReceiving) channel.publish('sync', { action: 'play', time: video.currentTime, sender: myClientId }); 
        };
        video.onpause = () => { 
            if (!isReceiving) channel.publish('sync', { action: 'pause', time: video.currentTime, sender: myClientId }); 
        };
        video.onseeked = () => { 
            if (!isReceiving) channel.publish('sync', { action: 'seek', time: video.currentTime, sender: myClientId }); 
        };

        // Mendengarkan sinyal sinkronisasi video
        channel.subscribe('sync', (message) => {
            const data = message.data;
            if (data.sender === myClientId) return; // Abaikan sinyal dari diri sendiri

            isReceiving = true;
            if (Math.abs(video.currentTime - data.time) > 1.5) {
                video.currentTime = data.time;
            }
            
            if (data.action === 'play') {
                video.play().catch(() => {});
            } else if (data.action === 'pause') {
                video.pause();
            }
            
            setTimeout(() => { isReceiving = false; }, 500);
        });

        // Menjawab permintaan dari orang baru yang baru masuk web
        channel.subscribe('request-status', (message) => {
            if (isHost && message.data.from !== myClientId) {
                // Hanya Host yang berhak mengirimkan detik terkininya ke pengguna baru
                channel.publish('response-status', {
                    to: message.data.from,
                    time: video.currentTime,
                    playing: !video.paused
                });
            }
        });

        // Pengguna baru menerima data setelan dari Host lama
        channel.subscribe('response-status', (message) => {
            const data = message.data;
            if (data.to === myClientId) {
                isReceiving = true;
                video.currentTime = data.time;
                if (data.playing) {
                    video.play().catch(() => {});
                } else {
                    video.pause();
                }
                setTimeout(() => { isReceiving = false; }, 500);
            }
        });

        // Jika Host menutup tab/keluar, otomatis tunjuk orang lain yang ada di room jadi Host baru
        channel.presence.subscribe('leave', (member) => {
            channel.presence.get((err, members) => {
                if (!err && members.length > 0) {
                    // Siapa yang berada di urutan daftar paling atas jadi Host pengganti
                    if (members[0].clientId === myClientId) {
                        isHost = true;
                        console.log("Host lama keluar. Kamu sekarang jadi Host baru.");
                    }
                }
            });
        });
    </script>
</body>
</html>
