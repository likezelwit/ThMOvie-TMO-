<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Coba Bioskop Streamtape - ThMovie</title>
    <style>
        body { background: #0b0c10; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .cinema-box { width: 90%; max-width: 700px; margin: 0 auto; position: relative; aspect-ratio: 16/9; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        /* Kunci Bioskop: Agar penonton tidak bisa klik pause di layar video */
        .blocker { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 45px); background: transparent; z-index: 5; }
        .btn-masuk { padding: 15px 30px; background: #66fcf1; color: black; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>

    <h2 id="judul-anime">Memuat Judul...</h2>
    
    <div class="cinema-box">
        <div class="blocker"></div>
        <!-- Link video embed streamtape milik Anda yang tadi -->
        <iframe id="tapePlayer" src="https://streamtape.com" allow="autoplay"></iframe>
    </div>
    
    <button class="btn-masuk" id="tombolKlik">🍿 MASUK BIOSKOP / SINKRONKAN DETIK</button>
    <p id="info-status">Membaca data server...</p>

    <script type="module">
        // PERBAIKAN: Jalur CDN Firebase wajib lengkap agar tidak terkena eror CORS
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, onValue } from "https://gstatic.com";

        // CONFIG FIREBASE: Pastikan Anda mengganti ini dengan Config asli dari Firebase Console Anda!
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://proyek-kamu-default-rtdb.firebaseio.com", // WAJIB GANTI URL DATABASE ASLI KAMU
            projectId: "proyek-kamu",
            storageBucket: "://appspot.com",
            messagingSenderId: "12345678",
            appId: "1:12345:web:abcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const iframe = document.getElementById('tapePlayer');
        const info = document.getElementById('info-status');
        const judul = document.getElementById('judul-anime');

        let waktuMulaiFilm = 0; 

        // Fungsi kirim perintah jarak jauh ke dalam Iframe Streamtape
        function kontrolStreamtape(perintah, nilai = null) {
            if (iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify({
                    'event': perintah, 'value': nilai
                }), '*');
            }
        }

        // Ambil data siaran langsung dari Firebase secara otomatis
        onValue(ref(db, 'bioskop_live'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                judul.innerText = data.judul;
                waktuMulaiFilm = data.waktu_mulai; 
                
                // Ganti link video otomatis jika admin memperbarui link di Firebase
                if (data.video_url && iframe.src !== data.video_url) {
                    iframe.src = data.video_url;
                }
            }
        });

        // Tombol Interaksi Wajib: Dolar masuk akun kamu + Menit langsung lompat sinkron
        document.getElementById('tombolKlik').addEventListener('click', () => {
            if (waktuMulaiFilm === 0) return alert("Belum ada data jadwal dari server.");
            
            const waktuSekarang = Date.now();
            const selisihDetik = Math.floor((waktuSekarang - waktuMulaiFilm) / 1000);

            if (selisihDetik > 0) {
                // Skenario Telat: Langsung dipaksa lompat ke detik yang sedang berjalan
                info.innerText = `Menyelaraskan waktu... Kamu telat ${Math.floor(selisihDetik/60)} menit.`;
                kontrolStreamtape('seek', selisihDetik);
                kontrolStreamtape('play');
            } else {
                // Skenario Tepat Waktu/Awal: Video disuruh diam di detik 0 menunggu jam tayang
                info.innerText = "Berhasil stand-by di kursi! Film akan mulai otomatis.";
                kontrolStreamtape('seek', 0);
                kontrolStreamtape('pause');
            }
        });

        // Interval otomatis tiap 1 detik untuk menyalakan video jika hitung mundur lobi habis
        setInterval(() => {
            if (waktuMulaiFilm > 0) {
                const waktuSekarang = Date.now();
                const selisihDetik = Math.floor((waktuSekarang - waktuMulaiFilm) / 1000);

                if (selisihDetik === 0) {
                    info.innerText = "Waktu lobi habis! Film dimulai sekarang!";
                    kontrolStreamtape('seek', 0);
                    kontrolStreamtape('play');
                } else if (selisihDetik < 0) {
                    const sisa = Math.abs(selisihDetik);
                    const menit = Math.floor(sisa / 60);
                    const detik = sisa % 60;
                    info.innerText = `Film dimulai dalam ${menit}m ${detik}s lagi.`;
                }
            }
        }, 1000);
    </script>
</body>
</html>
