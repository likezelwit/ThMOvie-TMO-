<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThMovie - Player</title>
    <style>
        body {
            background-color: #0d0d13;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .video-container {
            width: 90%;
            max-width: 800px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }
        video {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div class="video-container">
    <!-- Atribut dioptimalkan agar tidak memicu limit API Google di tengah jalan -->
    <video controls preload="metadata" crossorigin="anonymous">
        <source src="https://www.googleapis.com/drive/v3/files/1qJ26IK0GYZD4G0tdluOpFyLhSHsWCn0q?alt=media&lud=1743502542&pid=6242&sid=31979" type="video/mp4">
        Browser kamu gak support tag video ini, Lang.
    </video>
</div>

</body>
</html>
