<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMO Player - Watch Together</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Header Player */
        .player-header {
            padding: 15px 20px;
            background: rgba(20,20,20,0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 10;
        }
        
        .movie-info { display: flex; align-items: center; gap: 15px; }
        .movie-thumb { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
        .movie-title { font-weight: 600; font-size: 1.1rem; }
        .sync-status { font-size: 0.8rem; color: #4caf50; background: rgba(76, 175, 80, 0.1); padding: 5px 10px; border-radius: 20px; }
        
        .exit-btn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; }
        .exit-btn:hover { background: #555; }

        /* Video Container */
        .video-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
        }

        video {
            width: 100%;
            max-height: 100vh;
            outline: none;
        }

        /* SHARE ROOM UI (NEW) */
        .share-box {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            display: none; /* Hidden by default until room loaded */
            align-items: center;
            gap: 10px;
            border: 1px solid #444;
            margin-bottom: 10px;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .share-label { font-size: 0.8rem; color: #aaa; white-space: nowrap; }
        
        .url-input-group {
            display: flex;
            flex: 1;
            background: #111;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 5px 10px;
        }

        .url-input-group input {
            background: transparent;
            border: none;
            color: #0078ff;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }

        .copy-btn {
            background: #333;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .copy-btn:hover { background: #0078ff; }

        /* Sync Indicator */
        .sync-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }
        .dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Error State */
        .error-msg {
            text-align: center;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="player-header">
        <div style="display: flex; align-items: center; gap: 20px;">
            <!-- SHARE BOX AREA (NEW) -->
            <div id="share-area" class="share-box">
                <div class="share-label"><i class="fas fa-users"></i> Room Code</div>
                <div class="url-input-group">
                    <input type="text" id="shareLinkInput" readonly>
                    <button class="copy-btn" onclick="copyLink()">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
            </div>

            <div class="movie-info">
                <img id="m-poster" class="movie-thumb" src="">
                <div>
                    <div id="m-title" class="movie-title">Loading...</div>
                    <div class="sync-status"><i class="fas fa-sync-alt fa-spin"></i> SINKRONISASI AKTIF</div>
                </div>
            </div>
        </div>

        <button class="exit-btn" onclick="window.location.href='../index.html'">
            <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
    </div>

    <div class="video-wrapper">
        <video id="mainVideo" controls>
            Browser Anda tidak mendukung tag video.
        </video>
        <div class="sync-indicator">
            <div class="dot"></div>
            Live Sync Mode: ON
        </div>
    </div>

    <script type="module">
    // --- FIREBASE CONFIG ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAumySmaAi8oHFnTu8QDtp_u_dZmoHlQd8",
        authDomain: "thmovie-3646f.firebaseapp.com",
        databaseURL: "https://thmovie-3646f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "thmovie-3646f",
        storageBucket: "thmovie-3646f.firebasestorage.app",
        messagingSenderId: "1041137356432",
        appId: "1:1041137356432:web:96edbe3402937c82f09215",
        measurementId: "G-6SNE976L7G"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. AMBIL DATA MOVIE
    const movieTitle = sessionStorage.getItem('activeMovieTitle');
    const videoSource = sessionStorage.getItem('activeVideoSource');
    const posterSource = sessionStorage.getItem('activePoster');

    const video = document.getElementById('mainVideo');
    const titleEl = document.getElementById('m-title');
    const posterEl = document.getElementById('m-poster');
    const shareArea = document.getElementById('share-area');
    const shareInput = document.getElementById('shareLinkInput');

    if (!videoSource || !movieTitle) {
        document.querySelector('.video-wrapper').innerHTML = '<div class="error-msg"><h2>Data Film Tidak Ditemukan.</h2><p>Silakan kembali ke halaman Tiket.</p></div>';
    } else {
        titleEl.innerText = movieTitle;
        posterEl.src = posterSource;
        video.src = videoSource;
    }

    // 2. LOGIKA ROOM & URL (BARU)
    // Cek apakah ada parameter 'room' di URL
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');

    if (!roomId) {
        // JIKA TIDAK ADA ROOM ID -> JADILAH HOST
        // Buat Room ID Unik (Contoh: room_abc123)
        roomId = 'room_' + Math.random().toString(36).substring(2, 8);
        
        // Update URL tanpa reload halaman
        const newUrl = `${window.location.pathname}?room=${roomId}`;
        window.history.replaceState({path: newUrl}, '', newUrl);
        
        console.log("Room Created:", roomId);
    } else {
        // JIKA ADA ROOM ID -> JADILAH GUEST
        console.log("Joined Room:", roomId);
    }

    // Tampilkan UI Share Link dan masukkan URL ke input
    shareArea.style.display = 'flex';
    shareInput.value = window.location.href;

    // 3. LOGIKA SINCRONISASI (SYNC LOGIC)
    // Menggunakan Room ID sebagai kunci database, bukan Judul Film
    const syncRef = ref(db, 'sync_rooms/' + roomId);

    // Fungsi update status ke Firebase (Setiap 1 detik)
    let isSyncing = false;
    setInterval(() => {
        // Jika video sedang tidak disinkronkan manual oleh user lain
        if (!isSyncing) {
            set(syncRef, {
                currentTime: video.currentTime,
                isPlaying: !video.paused,
                lastUpdate: Date.now()
            });
        }
    }, 1000);

    // Fungsi Mendengarkan perubahan dari User lain
    onValue(syncRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // Cek apakah update ini masih baru (bukan data lama)
        const now = Date.now();
        if (now - data.lastUpdate > 5000) return; // Abaikan data expired

        // LOGIKA ANTAR USER:
        // Jika perbedaan waktu > 2 detik, sinkronkan waktu video
        if (Math.abs(video.currentTime - data.currentTime) > 2) {
            isSyncing = true;
            video.currentTime = data.currentTime;
            setTimeout(() => { isSyncing = false; }, 500); // Kunci sinkron sebentar
        }

        // Sinkronisasi Play/Pause
        if (data.isPlaying && video.paused) {
            video.play().catch(e => console.log("Autoplay blocked, need user interaction"));
        } else if (!data.isPlaying && !video.paused) {
            video.pause();
        }
    });

    // --- FUNGSI COPY LINK ---
    window.copyLink = function() {
        shareInput.select();
        shareInput.setSelectionRange(0, 99999); // Untuk mobile
        navigator.clipboard.writeText(shareInput.value).then(() => {
            const btn = document.querySelector('.copy-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 2000);
        });
    }

    // Export fungsi copy ke window agar bisa dipanggil HTML inline
    window.copyLink = copyLink;

    </script>
</body>
</html>
