<!-- movie/index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TMO Player - Watch Together</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
        body{margin:0;background:#000;color:#fff;font-family:'Inter',sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
        
        /* Header */
        .player-header{padding:10px 14px;background:rgba(18,18,18,.98);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2a2a;z-index:50;flex-wrap:wrap;gap:8px;min-height:55px}
        .header-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
        .movie-info{display:flex;align-items:center;gap:10px;min-width:0}
        .movie-thumb{width:32px;height:32px;border-radius:4px;object-fit:cover;background:#222;flex-shrink:0}
        .movie-meta{min-width:0}
        .movie-title{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
        .badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
        .badge{font-size:.65rem;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.1)}
        .badge-sync{color:#4caf50;background:rgba(76,175,80,.15)}.badge-sync.err{color:#f44336;background:rgba(244,67,54,.15)}
        .badge-viewer{color:#ff9800;background:rgba(255,152,0,.15)}.badge-type{color:#9c27b0;background:rgba(156,39,176,.15)}
        .next-ep-btn{background:#7c3aed;color:#fff;border:none;padding:5px 12px;border-radius:12px;font-size:.7rem;cursor:pointer;font-weight:700;display:none;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(124,58,237,.3)}
        .next-ep-btn:active{transform:scale(.95)}
        .share-toggle{background:none;border:none;color:#888;font-size:1.1rem;cursor:pointer;padding:6px;border-radius:6px;transition:.2s}
        .share-toggle:hover{color:#fff}
        .share-box{background:#111;padding:6px 10px;border-radius:6px;display:none;align-items:center;gap:8px;border:1px solid #333;animation:slideD .3s ease}
        .share-label{font-size:.7rem;color:#888;white-space:nowrap;font-weight:600}
        .url-grp{display:flex;align-items:center;background:#1a1a1a;border:1px solid #3a3a3a;border-radius:4px;padding:2px 6px;width:100%}
        .url-grp input{background:0 0;border:none;color:#0078ff;font-size:.75rem;width:100%;outline:none;font-family:'JetBrains Mono',monospace}
        .copy-btn{background:#333;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:.7rem;white-space:nowrap;transition:.2s;font-family:'Inter',sans-serif}
        .copy-btn:hover{background:#0078ff}
        .exit-btn{background:#2a2a2a;color:#ccc;border:none;padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.8rem;transition:.2s;flex-shrink:0}
        .exit-btn:hover{background:#f44336;color:#fff}
        @keyframes slideD{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
        
        /* Video Area */
        .video-wrapper{flex:1;display:flex;justify-content:center;align-items:center;background:#000;position:relative;overflow:hidden;touch-action:none}
        video{width:100%;height:100%;object-fit:contain;outline:none;display:none}
        .iframe-container{width:100%;height:100%;display:none}
        iframe{width:100%;height:100%;border:none;outline:none}
        
        /* End Screen & Overlays */
        .end-screen{position:absolute;inset:0;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .5s;text-align:center;padding:20px}
        .end-screen.show{opacity:1;pointer-events:all}
        .end-screen i{font-size:3rem;color:#4caf50;margin-bottom:16px}
        .end-screen h2{font-size:1.5rem;margin-bottom:8px}
        .btn-p{background:#0078ff;color:#fff;border:none;padding:13px 32px;border-radius:50px;cursor:pointer;font-weight:700;font-size:1rem;margin-top:20px;font-family:'Inter',sans-serif}
        
        /* Modals */
        .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);z-index:2000;display:flex;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity .35s}
        .modal-ov.active{opacity:1;pointer-events:all}
        .modal-card{background:linear-gradient(145deg,#1e1e1e,#161616);padding:32px 28px;border-radius:16px;text-align:center;max-width:400px;width:92%;border:1px solid #333;box-shadow:0 20px 50px rgba(0,0,0,.6);transform:scale(.92);transition:transform .4s}
        .modal-ov.active .modal-card{transform:scale(1)}
        .m-icon{width:70px;height:70px;border-radius:50%;border:3px solid #0078ff;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;background:rgba(0,120,255,.05)}
        .time-disp{font-size:1.2rem;font-weight:800;letter-spacing:1px;font-family:'JetBrains Mono',monospace;margin-bottom:20px;color:#0078ff}
        .m-title{font-size:1.5rem;color:#fff;margin:0 0 10px}.m-sub{color:#888;margin:0 0 20px;font-size:.9rem;line-height:1.5}
        .btn-wait{background:#333;color:#aaa;border:none;padding:10px 24px;border-radius:50px;cursor:pointer;font-weight:600;transition:.2s;margin-top:15px}
        .btn-wait.active{background:#4caf50;color:#fff}

        /* Chat */
        .chat-toggle{background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer;padding:8px;border-radius:50%;transition:.2s;position:relative}
        .chat-toggle:active{background:rgba(255,255,255,.1)}
        .chat-badge{position:absolute;top:2px;right:2px;width:10px;height:10px;background:#f44336;border-radius:50%;border:2px solid#1a1a1a;display:none}
        .chat-badge.show{display:block}
        
        .chat-panel{position:absolute;top:0;right:0;width:100%;max-width:350px;height:100%;background:rgba(20,20,20,.98);backdrop-filter:blur(12px);border-left:1px solid #333;z-index:500;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:-5px 0 20px rgba(0,0,0,.5)}
        .chat-panel.open{transform:translateX(0)}
        .chat-head{padding:12px 16px;background:rgba(30,30,30,.9);border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
        .chat-head h4{margin:0;font-size:.95rem}
        .chat-close{background:none;border:none;color:#999;cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:4px}.chat-close:hover{color:#fff}
        
        .chat-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
        .chat-body::-webkit-scrollbar{width:4px}.chat-body::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
        .msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:.85rem;line-height:1.4;word-break:break-word;animation:msgIn .25s ease;cursor:pointer;transition:background .2s;position:relative}
        .msg:hover{filter:brightness(1.1)}
        @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .msg.self{align-self:flex-end;background:#0078ff;color:#fff;border-bottom-right-radius:2px}
        .msg.other{align-self:flex-start;background:#2a2a2a;color:#eee;border-bottom-left-radius:2px}
        .msg.system{align-self:center;background:transparent;color:#666;font-size:.75rem;padding:4px}
        .msg-name{font-size:.7rem;font-weight:700;color:#ff9800;margin-bottom:3px;display:block}
        .msg.self .msg-name{color:rgba(255,255,255,.7)}.msg.system .msg-name{display:none}
        .msg-time{font-size:.6rem;color:rgba(255,255,255,.3);margin-top:4px;display:block;text-align:right}
        .msg-reply-preview{font-size:.7rem;color:rgba(255,255,255,.5);font-style:italic;border-left:2px solid rgba(255,255,255,.3);padding-left:6px;margin-bottom:4px;display:block}

        .chat-input{padding:10px 12px;background:rgba(25,25,25,.95);border-top:1px solid #333;display:flex;gap:8px;flex-shrink:0;align-items:center}
        .chat-input input{flex:1;background:#2a2a2a;border:1px solid #444;border-radius:20px;padding:10px 14px;color:#fff;font-size:.9rem;outline:none;font-family:'Inter',sans-serif}
        .chat-input input:focus{border-color:#0078ff}
        .send-btn{background:#0078ff;border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
        .send-btn:active{transform:scale(.9)}

        .name-setup{padding:30px 20px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
        .name-setup i{font-size:2.5rem;color:#0078ff;margin-bottom:20px}.name-setup h4{margin:0 0 10px;font-size:1.2rem}
        .name-setup input{width:100%;max-width:240px;background:#2a2a2a;border:1px solid #444;border-radius:10px;padding:12px 16px;color:#fff;font-size:1rem;outline:none;text-align:center;margin-bottom:15px}
        .name-setup input:focus{border-color:#0078ff}
        .name-setup button{background:#0078ff;color:#fff;border:none;padding:10px 30px;border-radius:20px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}

        /* Utilities */
        .mode{display:none}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(30,30,30,.95);backdrop-filter:blur(8px);color:#fff;padding:12px 24px;border-radius:12px;font-size:.9rem;z-index:9999;border:1px solid #444;opacity:0;transition:all .35s;pointer-events:none}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        
        @media(max-width:640px){
            .player-header{padding:8px 12px;min-height:50px}
            .movie-thumb{width:28px;height:28px}
            .movie-title{font-size:.85rem;max-width:120px}
            .chat-panel{width:100%;border-left:none;border-top:1px solid #333}
            .modal-card{padding:24px 18px;border-radius:12px}
            .m-title{font-size:1.2rem}
            .m-icon{width:60px;height:60px}
        }
        /* Fullscreen Handling for Chat */
        :fullscreen .chat-panel{transform:translateX(100%)} 
        :fullscreen .chat-panel.open{transform:translateX(0)}
        :fullscreen .player-header{display:none} 
    </style>
</head>
<body>

<div class="player-header">
    <div class="header-left">
        <button class="share-toggle" id="shareToggle"><i class="fas fa-share-alt"></i></button>
        <div id="share-area" class="share-box">
            <div class="share-label"><i class="fas fa-users"></i> Room</div>
            <div class="url-grp"><input type="text" id="shareLinkInput" readonly><button class="copy-btn" id="btnCopy"><i class="fas fa-copy"></i></button></div>
        </div>
        <div class="movie-info">
            <img id="m-poster" class="movie-thumb" src="" alt="">
            <div class="movie-meta">
                <div id="m-title" class="movie-title">Memuat...</div>
                <div class="badges">
                    <span id="syncBadge" class="badge badge-sync"><i class="fas fa-sync fa-spin"></i> Sync...</span>
                    <span id="viewerBadge" class="badge badge-viewer" style="display:none"><i class="fas fa-eye"></i> <span id="viewerCount">0</span></span>
                    <span id="typeBadge" class="badge badge-type" style="display:none"></span>
                    <button id="nextEpBtn" class="next-ep-btn" onclick="playNextEpisode()"><i class="fas fa-forward"></i> Next Ep</button>
                </div>
            </div>
        </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
        <button class="chat-toggle" id="chatBtn">
            <i class="fas fa-comment-dots"></i>
            <div class="chat-badge" id="unreadDot"></div>
        </button>
        <button class="exit-btn" id="exitBtn"><i class="fas fa-times"></i></button>
    </div>
</div>

<div class="video-wrapper" id="videoWrapper">
    <!-- Video Element -->
    <video id="mainVideo" preload="auto" playsinline style="display:none"></video>
    <!-- Iframe Container -->
    <div id="iframeContainer" class="iframe-container"></div>

    <div class="end-screen" id="endScreen">
        <i class="fas fa-check-circle"></i>
        <h2>Selesai</h2>
        <p>Terima kasih telah menonton.</p>
        <button class="btn-p" onclick="location.href='../index.html'"><i class="fas fa-home"></i> Kembali</button>
    </div>
</div>

<!-- Chat Panel -->
<div class="chat-panel" id="chatPanel">
    <div class="chat-head">
        <h4><i class="fas fa-comments"></i> Obrolan</h4>
        <button class="chat-close" id="chatClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="name-setup" id="nameSetup">
        <i class="fas fa-user-circle"></i>
        <h4>Masukkan Nama</h4>
        <input type="text" id="nameInput" placeholder="Nama..." maxlength="12" autocomplete="off">
        <button id="nameSubmit">Masuk</button>
    </div>
    <div class="chat-body" id="chatBody" style="display:none"></div>
    <div class="chat-input" id="chatInputArea" style="display:none">
        <input type="text" id="msgInput" placeholder="Ketik pesan..." maxlength="200" autocomplete="off">
        <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<div class="modal-ov" id="mainModal">
    <div class="modal-card">
        <div id="modeLoading" class="mode"><div class="m-icon"><i class="fas fa-circle-notch fa-spin" style="font-size:1.5rem;color:#0078ff"></i></div><h2 class="m-title">Menghubungkan...</h2><p class="m-sub">Sinkronisasi waktu.</p></div>
        <div id="modeCountdown" class="mode"><div class="m-icon"><i class="fas fa-clock" style="font-size:1.5rem;color:#ff9800"></i><div class="time-disp" id="cdTimer">00:00</div></div><h2 class="m-title">Film Belum Mulai</h2><p class="m-sub">Menunggu jam tayang.</p><button id="btnJoinWait" class="btn-wait">Tunggu di Ruangan</button></div>
        <div id="modeError" class="mode"><div class="m-icon" style="border-color:#f44336"><i class="fas fa-exclamation-triangle" style="font-size:1.5rem;color:#f44336"></i></div><h2 class="m-title">Error</h2><p class="m-sub" id="errMsg">Terjadi kesalahan.</p><button class="btn-wait" onclick="location.href='../index.html'">Kembali</button></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,set,update,onValue,onDisconnect,push,query,limitToLast,onChildAdded}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyAumySmaAi8oHFnTu8QDtp_u_dZmoHlQd8",authDomain:"thmovie-3646f.firebaseapp.com",databaseURL:"https://thmovie-3646f-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"thmovie-3646f",storageBucket:"thmovie-3646f.firebasestorage.app",messagingSenderId:"1041137356432",appId:"1:1041137356432:web:96edbe3402937c82f09215",measurementId:"G-6SNE976L7G"};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

// Elements
const video=document.getElementById('mainVideo');
const iframeContainer=document.getElementById('iframeContainer');
const titleEl=document.getElementById('m-title');
const posterEl=document.getElementById('m-poster');
const shareArea=document.getElementById('share-area');
const shareInput=document.getElementById('shareLinkInput');
const mainModal=document.getElementById('mainModal');
const toastEl=document.getElementById('toast');
const syncBadge=document.getElementById('syncBadge');
const viewerBadge=document.getElementById('viewerBadge');
const viewerCount=document.getElementById('viewerCount');
const typeBadge=document.getElementById('typeBadge');
const nextEpBtn=document.getElementById('nextEpBtn');
const unreadDot=document.getElementById('unreadDot');
const endScreen=document.getElementById('endScreen');
const chatPanel=document.getElementById('chatPanel');
const nameSetup=document.getElementById('nameSetup');
const nameInput=document.getElementById('nameInput');
const chatBody=document.getElementById('chatBody');
const chatInputArea=document.getElementById('chatInputArea');
const msgInput=document.getElementById('msgInput');
const modes={loading:document.getElementById('modeLoading'),countdown:document.getElementById('modeCountdown'),error:document.getElementById('modeError')};

// State
let roomId=null, bookingTimestamp=null;
let playerType='video'; // 'video' or 'iframe'
let contentType='movie';
let cdInterval=null, syncInterval=null;
let chatOpen=false, chatName=null, chatUserId=null;
let unreadCount=0;
let seriesData = { currentKey: null, parentKey: null, episodes: {} };

// Utils
function showToast(m){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),3000)}
function showMode(n){Object.values(modes).forEach(e=>e.style.display='none');if(modes[n])modes[n].style.display='block'}
function escH(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtTime(s){const m=Math.floor(s/60);const ss=Math.floor(s%60);return`${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}

// ===== INIT =====
const urlP=new URLSearchParams(window.location.search);
roomId=urlP.get('room');
contentType=(sessionStorage.getItem('activeContentType')||'movie').toLowerCase();

// Load Series Data
if(contentType === 'series') {
    seriesData.parentKey = sessionStorage.getItem('activeParentKey') || '';
    seriesData.currentKey = sessionStorage.getItem('activeEpKey') || '';
    try { seriesData.episodes = JSON.parse(sessionStorage.getItem('activeEpisodesData') || '{}'); checkNextEpisode(); } catch(e){}
}

if(!roomId){showErr('Room ID Hilang');return;}

shareArea.style.display='flex';
shareInput.value=location.href;

// ===== LOAD DATA =====
onValue(ref(db,'sync_rooms/'+roomId+'/meta'),(snap)=>{
    const m=snap.val();
    if(!m){showErr('Ruangan tidak ditemukan');return;}
    titleEl.textContent=m.title||'Unknown';
    if(m.posterSrc)posterEl.src=m.posterSrc;
    bookingTimestamp=m.targetTime?parseInt(m.targetTime,10):null;
    
    contentType=(m.contentType||'movie').toLowerCase();
    if(contentType!=='movie'){
        typeBadge.textContent=contentType.toUpperCase();
        typeBadge.style.display='inline-flex';
    }
    
    if(m.videoSource){
        setupPlayer(m.videoSource);
        decideMode();
    }else{showErr('Video Tidak Tersedia');}
    
    registerViewer();
});

// ===== CINEMA MODE LOGIC (NO HOST) =====
function decideMode(){
    if(!bookingTimestamp){
        showErr('Waktu tayang belum ditentukan');
        return;
    }
    
    const now = Date.now();
    const diff = bookingTimestamp - now;
    
    if(diff > 0){
        // Belum mulai
        startCountdown(diff);
    } else {
        // Sudah mulai atau lewat
        startCinemaPlayback();
    }
}

function startCountdown(ms){
    showMode('countdown');
    mainModal.classList.add('active');
    
    function tick(){
        const d = bookingTimestamp - Date.now();
        if(d <= 0){
            clearInterval(cdInterval);
            startCinemaPlayback();
        } else {
            document.getElementById('cdTimer').textContent = fmtTime(d/1000);
        }
    }
    tick();
    cdInterval = setInterval(tick, 1000);
    
    document.getElementById('btnJoinWait').onclick = () => {
        mainModal.classList.remove('active'); // Sembunyikan modal, biarkan user lihat layar hitam/bg
        showToast('Menunggu waktu tayang...');
    };
}

function startCinemaPlayback(){
    mainModal.classList.remove('active');
    syncBadge.innerHTML = '<i class="fas fa-check-circle"></i> Live';
    syncBadge.className = 'badge badge-sync';
    
    if(playerType === 'video'){
        video.play().catch(()=>showToast('Klik layar untuk memutar'));
    } else {
        // Iframe logic
        ensureIframePlaying();
    }
    
    // Mulai sinkronisasi waktu (Cinema Mode)
    if(syncInterval) clearInterval(syncInterval);
    syncInterval = setInterval(cinemaSync, 2000); // Cek setiap 2 detik
}

function cinemaSync(){
    if(!bookingTimestamp) return;
    
    const now = Date.now();
    // Waktu seharusnya sekarang adalah selisih waktu sekarang dengan waktu booking
    const targetTime = (now - bookingTimestamp) / 1000;
    
    if(playerType === 'video'){
        // Jika selisih lebih dari 2 detik, seek paksa
        if(Math.abs(video.currentTime - targetTime) > 2.0){
            video.currentTime = targetTime;
        }
        // Paksa play jika pause
        if(video.paused && targetTime > 0 && targetTime < video.duration) {
            video.play().catch(()=>{});
        }
    } else {
        // Untuk Iframe, kita coba postMessage play jika kita mendeteksi user mungkin pause
        // Tapi Streamtape iframe sulit dideteksi currentTimenya dari luar.
        // Kita hanya kirim perintah play sebagai "heartbeat" agar tetap nyala.
        const iframe = iframeContainer.querySelector('iframe');
        if(iframe && iframe.contentWindow){
            iframe.contentWindow.postMessage(JSON.stringify({event:"command",func:"play",args:[]}), "*");
        }
    }
}

function ensureIframePlaying(){
    const iframe = iframeContainer.querySelector('iframe');
    if(iframe && iframe.contentWindow){
        // Coba trigger play awal
        iframe.contentWindow.postMessage(JSON.stringify({event:"command",func:"play",args:[]}), "*");
    }
}

// ===== PLAYER SETUP =====
function setupPlayer(source){
    if(source.trim().startsWith('<iframe')){
        playerType = 'iframe';
        video.style.display = 'none';
        iframeContainer.style.display = 'block';
        iframeContainer.innerHTML = source;
    } else {
        playerType = 'video';
        iframeContainer.style.display = 'none';
        video.style.display = 'block';
        video.src = source;
        
        // Hapus event listener lama jika ada agar tidak double
        video.onended = () => { endScreen.classList.add('show'); if(syncInterval)clearInterval(syncInterval); };
    }
}

// Series Logic
function checkNextEpisode() {
    if(!seriesData.currentKey || !seriesData.episodes) { nextEpBtn.style.display = 'none'; return; }
    const keys = Object.keys(seriesData.episodes).sort((a,b)=>parseInt(a)-parseInt(b));
    const idx = keys.indexOf(String(seriesData.currentKey));
    if(idx >= 0 && idx < keys.length - 1) {
        nextEpBtn.style.display = 'flex';
        nextEpBtn.onclick = () => playSpecificEpisode(keys[idx + 1]);
    } else { nextEpBtn.style.display = 'none'; }
}
window.playNextEpisode = () => { /* Placeholder */ };

function playSpecificEpisode(epKey) {
    if(!seriesData.episodes[epKey]) return;
    const ep = seriesData.episodes[epKey];
    titleEl.textContent = `${seriesData.parentKey} - Ep.${epKey}`;
    setupPlayer(ep.videoSource);
    seriesData.currentKey = epKey;
    checkNextEpisode();
    // Reset sync time start
    bookingTimestamp = Date.now(); 
    startCinemaPlayback();
}

// ===== VIEWER COUNT =====
function registerViewer(){
    if(!chatUserId){
        chatUserId='u_'+Math.random().toString(36).substring(2,7);
        sessionStorage.setItem('tmo_uid',chatUserId);
    }
    const vRef=ref(db,'sync_rooms/'+roomId+'/viewers/'+chatUserId);
    set(vRef,{joinedAt:Date.now()}).catch(()=>{});
    onDisconnect(vRef).remove();
    
    // Listen viewers count
    onValue(ref(db,'sync_rooms/'+roomId+'/viewers'),(snap)=>{
        const c=snap.val();
        const count=c?Object.keys(c).length:0;
        viewerCount.textContent=count;
        viewerBadge.style.display='inline-flex';
    });
}

// ===== CHAT SYSTEM (REPLY & NOTIF) =====
function initChatUI(){
    if(chatName){
        nameSetup.style.display='none';
        chatBody.style.display='flex';
        chatInputArea.style.display='flex';
        loadChatMessages();
    }
}

function loadChatMessages(){
    const cr=query(ref(db,'sync_rooms/'+roomId+'/chat'),limitToLast(50));
    onChildAdded(cr,(snap)=>{
        const m=snap.val();
        if(!m)return;
        appendMsg(m);
        if(!chatOpen && m.uid!==chatUserId){
            unreadCount++;
            unreadDot.classList.add('show');
            // Efek getar kecil pada badge
            unreadDot.style.transform = 'scale(1.5)';
            setTimeout(()=>unreadDot.style.transform='scale(1)', 200);
        }
        if(chatOpen) chatBody.scrollTop=chatBody.scrollHeight;
    });
}

function appendMsg(m){
    const div=document.createElement('div');
    const isSelf=m.uid===chatUserId;
    div.className='msg '+(isSelf?'self':'other');
    
    let replyHtml = '';
    if(m.replyTo) {
        replyHtml = `<span class="msg-reply-preview">Replying to <b>${escH(m.replyTo.name)}</b></span>`;
    }

    div.innerHTML=`${replyHtml}<span class="msg-name">${isSelf?'Anda':escH(m.name)}</span>${escH(m.text)}<span class="msg-time">${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</span>`;
    
    // Event listener untuk reply
    if(!isSelf){
        div.onclick = () => {
            msgInput.value = `@${escH(m.name)} `;
            msgInput.focus();
            msgInput.dataset.replyUid = m.uid;
            msgInput.dataset.replyName = m.name;
        };
    }
    
    chatBody.appendChild(div);
}

function sendMsg(){
    const txt=msgInput.value.trim();
    if(!txt||!chatName)return;
    
    const replyData = {};
    if(msgInput.dataset.replyUid) {
        replyData.replyTo = { uid: msgInput.dataset.replyUid, name: msgInput.dataset.replyName };
        delete msgInput.dataset.replyUid;
        delete msgInput.dataset.replyName;
    }

    msgInput.value='';
    push(ref(db,'sync_rooms/'+roomId+'/chat'),{
        uid:chatUserId,
        name:chatName,
        text:txt,
        ts:Date.now(),
        ...replyData
    }).catch(()=>showToast('Gagal kirim'));
}

// Chat Interaction
document.getElementById('chatBtn').addEventListener('click',toggleChat);
document.getElementById('chatClose').addEventListener('click',toggleChat);

function toggleChat(){
    chatOpen=!chatOpen;
    chatPanel.classList.toggle('open',chatOpen);
    if(chatOpen){
        unreadCount=0;
        unreadDot.classList.remove('show');
        setTimeout(()=>chatBody.scrollTop=chatBody.scrollHeight,100);
        msgInput.focus();
    }
}

document.getElementById('nameSubmit').addEventListener('click',submitName);
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter')submitName();});

function submitName(){
    const n=nameInput.value.trim();
    if(!n){nameInput.style.borderColor='#f44336';return;}
    chatName=n;
    sessionStorage.setItem('tmo_name',n);
    initChatUI();
}

document.getElementById('sendBtn').addEventListener('click',sendMsg);
msgInput.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});

// Misc UI
document.getElementById('shareToggle').addEventListener('click',()=>shareArea.classList.toggle('mobile-open'));
document.getElementById('btnCopy').addEventListener('click',function(){
    if(navigator.clipboard){
        navigator.clipboard.writeText(shareInput.value).then(()=>{this.innerHTML='<i class="fas fa-check"></i>'});
    } else {
        shareInput.select();document.execCommand('copy');
    }
    setTimeout(()=>this.innerHTML='<i class="fas fa-copy"></i>',1500);
});
document.getElementById('exitBtn').addEventListener('click',()=>location.href='../index.html');

function showErr(m){
    document.getElementById('errMsg').textContent=m;
    showMode('error');
    mainModal.classList.add('active');
    syncBadge.className='badge badge-sync err';
    syncBadge.innerHTML='Offline';
}

window.addEventListener('beforeunload',()=>{
    if(cdInterval)clearInterval(cdInterval);
    if(syncInterval)clearInterval(syncInterval);
});

// Init
setTimeout(initChatUI, 500);
</script>
