<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMO Player - Watch Together</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background: #000; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        /* Header Player */
        .player-header {
            padding: 10px 20px;
            background: rgba(20,20,20,0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 10;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .movie-info { display: flex; align-items: center; gap: 12px; }
        .movie-thumb { width: 35px; height: 35px; border-radius: 5px; object-fit: cover; background: #222; }
        .movie-title { font-weight: 600; font-size: 1rem; }
        .sync-status { font-size: 0.75rem; color: #4caf50; background: rgba(76, 175, 80, 0.1); padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
        
        .exit-btn { background: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
        .exit-btn:hover { background: #555; }

        .video-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            position: relative;
            overflow: hidden;
            max-height: calc(100vh - 70px);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* Start Up Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #444;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .countdown-circle {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 4px solid #0078ff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px;
        }

        .time-display { font-size: 1.1rem; font-weight: 800; }

        /* SHARE BOX */
        .share-box {
            background: #111;
            padding: 8px 12px;
            border-radius: 6px;
            display: none; 
            align-items: center;
            gap: 10px;
            border: 1px solid #333;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .share-label { font-size: 0.75rem; color: #aaa; white-space: nowrap; font-weight: 600; }
        
        .url-input-group {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 3px 8px;
            width: 200px;
        }

        .url-input-group input {
            background: transparent;
            border: none;
            color: #0078ff;
            font-size: 0.8rem;
            width: 100%;
            outline: none;
        }

        .copy-btn {
            background: #333;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            white-space: nowrap;
            transition: 0.2s;
        }
        .copy-btn:hover:not(:disabled) { background: #0078ff; }
        .copy-btn:disabled { background: #555; cursor: not-allowed; opacity: 0.6; }

        /* SYNC INDICATOR */
        .sync-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            z-index: 5;
        }
        .dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Disabled Video Overlay */
        .video-controls-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .video-controls-overlay.modal-active { display: flex; }

        .error-msg {
            text-align: center;
            color: #fff;
            padding: 20px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="player-header">
        <div class="header-left">
            <div id="share-area" class="share-box">
                <div class="share-label"><i class="fas fa-users"></i> Room</div>
                <div class="url-input-group">
                    <input type="text" id="shareLinkInput" readonly>
                    <button class="copy-btn" id="btnCopyAction">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
            </div>

            <div class="movie-info">
                <img id="m-poster" class="movie-thumb" src="">
                <div>
                    <div id="m-title" class="movie-title">Loading...</div>
                    <div class="sync-status"><i class="fas fa-sync-alt fa-spin"></i> SINKRONISASI AKTIF</div>
                </div>
            </div>
        </div>

        <button class="exit-btn" onclick="window.location.href='../index.html'">
            <i class="fas fa-sign-out-alt"></i> Keluar
        </button>
    </div>

    <div class="video-wrapper" id="content-area">
        <video id="mainVideo" controls>
            Browser Anda tidak mendukung tag video.
        </video>
        <div class="sync-indicator">
            <div class="dot"></div>
            Live Sync Mode: ON
        </div>
        
        <div class="video-controls-overlay" id="controlsOverlay">
            <div style="text-align: center; padding: 40px;">
                <div class="countdown-circle">
                    <i class="fas fa-clock" style="font-size: 1.2rem; color: #0078ff; margin-bottom: 2px;"></i>
                    <div class="time-display" id="countdownTimer">00:00:00</div>
                </div>
                <h2 style="font-size: 2rem; color: white; margin-bottom: 10px;">FILM BELUM MULAI!</h2>
                <p style="color: #ccc; margin-bottom: 25px;">Film dapat diputar pada jam tayang:</p>
                <p id="targetTimeDisplay" style="font-size: 1.2rem; color: #0078ff; font-weight: 800; margin-bottom: 20px;"></p>
                
                <button id="btnStartNowMain" class="copy-btn" style="padding: 15px 40px; background: #0078ff; font-weight: bold; border-radius: 50px; font-size: 1.1rem;">
                    OKE, MULAI NONTON!
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="startUpModal">
        <div class="modal-content">
            <i class="fas fa-clock" style="font-size: 2rem; color: #0078ff; margin-bottom: 15px;"></i>
            <h2 style="color: white; margin-top: 0;">Belum Saatnya!</h2>
            <p style="color: #ccc; margin-bottom: 20px;">Film ini belum bisa diputar. Menunggu sampai jam tayang.</p>
            <div class="countdown-circle" style="width: 100px; height: 100px;">
                <div class="time-display" id="modalCountdown" style="font-size: 1.3rem;">00:00:00</div>
            </div>
            <p id="modalTargetTime" style="font-size: 1.2rem; color: #4caf50; font-weight: bold; margin-top: 10px; margin-bottom: 20px;">00:00</p>
            <button id="btnStartNowModal" class="copy-btn" style="padding: 15px 40px; background: #0078ff; font-weight: bold; border-radius: 50px; font-size: 1.1rem;">
                OKE, MULAI NONTON!
            </button>
        </div>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAumySmaAi8oHFnTu8QDtp_u_dZmoHlQd8",
        authDomain: "thmovie-3646f.firebaseapp.com",
        databaseURL: "https://thmovie-3646f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "thmovie-3646f",
        storageBucket: "thmovie-3646f.firebasestorage.app",
        messagingSenderId: "1041137356432",
        appId: "1:1041137356432:web:96edbe3402937c82f09215",
        measurementId: "G-6SNE976L7G"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Video Elements
    const video = document.getElementById('mainVideo');
    const titleEl = document.getElementById('m-title');
    const posterEl = document.getElementById('m-poster');
    const contentArea = document.getElementById('content-area');
    const shareArea = document.getElementById('share-area');
    const shareInput = document.getElementById('shareLinkInput');
    
    const startUpModal = document.getElementById('startUpModal');
    const controlsOverlay = document.getElementById('controlsOverlay');
    const countdownTimer = document.getElementById('countdownTimer');
    const modalCountdown = document.getElementById('modalCountdown');
    const targetTimeEl = document.getElementById('targetTimeDisplay');
    const modalTargetTime = document.getElementById('modalTargetTime');
    
    const btnStartNowMain = document.getElementById('btnStartNowMain');
    const btnStartNowModal = document.getElementById('btnStartNowModal');

    // Ambil parameter room dari URL
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    let isHost = false;

    let bookingTimestamp = null;

    if (!roomId) {
        isHost = true;
        roomId = 'room_' + Math.random().toString(36).substring(2, 8);
        const newUrl = `${window.location.pathname}?room=${roomId}`;
        window.history.replaceState({path: newUrl}, '', newUrl);
        
        // Ambil data film dari sessionStorage Host
        const movieTitle = sessionStorage.getItem('activeMovieTitle');
        const videoSource = sessionStorage.getItem('activeVideoSource');
        const posterSource = sessionStorage.getItem('activePoster');
        const activeBookingTime = sessionStorage.getItem('activeBookingTime'); 

        if (!videoSource || !movieTitle) {
            contentArea.innerHTML = '<div class="error-msg"><h2>Data Film Tidak Ditemukan.</h2><p>Silakan kembali ke halaman Tiket.</p></div>';
        } else {
            titleEl.innerText = movieTitle;
            if(posterSource) posterEl.src = posterSource;
            video.src = videoSource;

            bookingTimestamp = activeBookingTime ? parseInt(activeBookingTime, 10) : null;

            // Simpan metadata film + waktu tayang ke Firebase agar Guest bisa sinkronisasi
            set(ref(db, 'sync_rooms/' + roomId + '/meta'), {
                title: movieTitle,
                videoSrc: videoSource,
                posterSrc: posterSource || "",
                targetTime: bookingTimestamp || 0
            });
        }
    } else {
        isHost = false;
        console.log("Joined Room sebagai Guest:", roomId);
    }

    shareArea.style.display = 'flex';
    shareInput.value = window.location.href;

    const syncRef = ref(db, 'sync_rooms/' + roomId + '/status');
    const metaRef = ref(db, 'sync_rooms/' + roomId + '/meta');
    
    let isSyncing = false;
    let startUpInterval = null;

    // Jika Guest, tarik metadata film dari Firebase terlebih dahulu
    if (!isHost) {
        onValue(metaRef, (snapshot) => {
            const meta = snapshot.val();
            if (meta) {
                titleEl.innerText = meta.title;
                if(meta.posterSrc) posterEl.src = meta.posterSrc;
                if(video.src !== meta.videoSrc) video.src = meta.videoSrc;
                
                bookingTimestamp = meta.targetTime ? parseInt(meta.targetTime, 10) : null;
                checkStartUp();
            } else {
                contentArea.innerHTML = '<div class="error-msg"><h2>Kamar Tidak Valid atau Telah Dihapus.</h2><p>Minta Host untuk membagikan ulang link.</p></div>';
            }
        }, { onlyOnce: true });
    } else {
        // Jika Host langsung cek waktu muat
        checkStartUp();
    }

    // Fungsi Pengendali Waktu Mulai Film
    function checkStartUp() {
        if (!bookingTimestamp || bookingTimestamp <= 0) {
            startVideo(); 
            return;
        }

        const now = Date.now();
        const diffMs = bookingTimestamp - now;

        if (diffMs > 0) {
            // Belum waktunya tayang
            controlsOverlay.classList.add('modal-active');
            startUpModal.classList.add('active');
            if (!video.paused) video.pause();
            
            // Aktifkan hitung mundur per detik
            if (startUpInterval) clearInterval(startUpInterval);
            updateCountdown(bookingTimestamp);
            startUpInterval = setInterval(() => updateCountdown(bookingTimestamp), 1000);
        } else {
            // Sudah masuk waktu tayang
            startVideo();
        }
    }

    function updateCountdown(targetTs) {
        const now = Date.now();
        let diff = targetTs - now;

        if (diff <= 0) {
            clearInterval(startUpInterval);
            countdownTimer.innerText = "00:00:00";
            modalCountdown.innerText = "00:00:00";
            
            btnStartNowMain.disabled = false;
            btnStartNowModal.disabled = false;
            btnStartNowMain.innerText = "OKE, MULAI NONTON!";
            btnStartNowModal.innerText = "MULAI NONTON!";
        } else {
            // Perbaikan rumus hitung waktu real jam:menit:detik
            const h = Math.floor(diff / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            const hStr = h.toString().padStart(2, '0');
            const mStr = m.toString().padStart(2, '0');
            const sStr = s.toString().padStart(2, '0');
            
            const timeStr = `${hStr}:${mStr}:${sStr}`;
            countdownTimer.innerText = timeStr;
            modalCountdown.innerText = timeStr;

            const timeFormatted = new Date(targetTs).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            targetTimeEl.innerText = timeFormatted;
            modalTargetTime.innerText = timeFormatted;

            // Kunci tombol jika belum saatnya
            btnStartNowMain.disabled = true;
            btnStartNowModal.disabled = true;
            btnStartNowMain.innerText = "MENUNGGU JAM TAYANG...";
            btnStartNowModal.innerText = "BELUM MULAI";
        }
    }

    function startVideo() {
        if (startUpInterval) clearInterval(startUpInterval);
        controlsOverlay.classList.remove('modal-active');
        startUpModal.classList.remove('active');
        
        video.play().catch(e => console.log("Autoplay dicegah oleh kebijakan browser. Butuh klik dari user."));
    }

    // Hubungkan fungsi tombol start ke Event Listener agar bisa diklik saat countdown beres
    btnStartNowMain.addEventListener('click', startVideo);
    btnStartNowModal.addEventListener('click', startVideo);

    // --- REALTIME SYNC PLAYBACK LOGIC ---
    setInterval(() => {
        if (!isSyncing && !video.paused) {
            set(syncRef, {
                currentTime: video.currentTime,
                isPlaying: !video.paused,
                lastUpdate: Date.now()
            });
        }
    }, 1000);

    video.onplay = () => {
        if (!isSyncing) set(syncRef, { currentTime: video.currentTime, isPlaying: true, lastUpdate: Date.now() });
    };
    video.onpause = () => {
        if (!isSyncing) set(syncRef, { currentTime: video.currentTime, isPlaying: false, lastUpdate: Date.now() });
    };
    video.onseeked = () => {
        if (!isSyncing) set(syncRef, { currentTime: video.currentTime, isPlaying: !video.paused, lastUpdate: Date.now() });
    };

    onValue(syncRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const now = Date.now();
        if (now - data.lastUpdate > 5000) return;

        if (Math.abs(video.currentTime - data.currentTime) > 2) {
            isSyncing = true;
            video.currentTime = data.currentTime;
            setTimeout(() => { isSyncing = false; }, 500);
        }

        if (data.isPlaying && video.paused) {
            video.play().catch(e => console.log("Gagal memutar otomatis. Menunggu interaksi klik."));
        } else if (!data.isPlaying && !video.paused) {
            video.pause();
        }
    });

    // Copy Link Clipboard Action
    document.getElementById('btnCopyAction').addEventListener('click', function() {
        shareInput.select();
        shareInput.setSelectionRange(0, 99999); 
        navigator.clipboard.writeText(shareInput.value).then(() => {
            const btn = document.getElementById('btnCopyAction');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => { btn.innerHTML = originalText; }, 2000);
        });
    });
    </script>
</body>
</html>
