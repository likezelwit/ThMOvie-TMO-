<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMO Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #0078ff; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; outline: none; font-size: 1rem; }
        input:focus { border-color: #0078ff; }
        button { width: 100%; padding: 15px; background: #0078ff; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0056b3; transform: translateY(-2px); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        .note { font-size: 0.8rem; color: #888; margin-top: 5px; }
        #status { margin-top: 20px; text-align: center; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-upload"></i> Tambah Film</h2>
    
    <div class="form-group">
        <label>Judul Film</label>
        <input type="text" id="movieTitle" placeholder="Contoh: Naruto Shippuden">
    </div>

    <div class="form-group">
        <label>Genre</label>
        <input type="text" id="movieGenre" placeholder="Contoh: Action, Anime">
    </div>

    <div class="form-group">
        <label>Link Poster (URL Gambar)</label>
        <input type="text" id="moviePoster" placeholder="https://...">
    </div>

    <div class="form-group">
        <label>Link Dropbox Video (Wajib diakhiri &dl=0)</label>
        <input type="text" id="dropboxLink" placeholder="https://www.dropbox.com/...&dl=0">
        <div class="note" style="color: #0078ff; font-weight:bold;">Sistem akan otomatis mengubah link menjadi &raw=1</div>
    </div>

    <button onclick="uploadMovie()" id="btnSubmit">Kirim ke Firebase</button>
    <div id="status"></div>
</div>

<script type="module">
    // Import Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // --- KONFIGURASI FIREBASE ANDA (SUDAH DIUPDATE) ---
    const firebaseConfig = {
        apiKey: "AIzaSyAumySmaAi8oHFnTu8QDtp_u_dZmoHlQd8",
        authDomain: "thmovie-3646f.firebaseapp.com",
        databaseURL: "https://thmovie-3646f-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "thmovie-3646f",
        storageBucket: "thmovie-3646f.firebasestorage.app",
        messagingSenderId: "1041137356432",
        appId: "1:1041137356432:web:96edbe3402937c82f09215",
        measurementId: "G-6SNE976L7G"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const moviesRef = ref(db, 'movies');

    window.uploadMovie = function() {
        const title = document.getElementById('movieTitle').value;
        const genre = document.getElementById('movieGenre').value;
        const poster = document.getElementById('moviePoster').value;
        let videoLink = document.getElementById('dropboxLink').value;

        if(!title || !poster || !videoLink) {
            alert("Mohon isi semua data!");
            return;
        }

        // Logika Ubah Link Dropbox
        if (videoLink.includes('&dl=0')) {
            videoLink = videoLink.replace('&dl=0', '&raw=1');
            console.log("Link dikonversi ke Raw:", videoLink);
        } else {
            alert("Pastikan link Dropbox diakhiri dengan &dl=0");
            return;
        }

        const newMovie = {
            title: title,
            genre: genre,
            poster: poster,
            videoSource: videoLink,
            createdAt: new Date().toISOString()
        };

        const btn = document.getElementById('btnSubmit');
        const originalText = btn.innerText;
        btn.innerText = "Mengirim...";
        btn.disabled = true;

        push(moviesRef, newMovie)
            .then(() => {
                document.getElementById('status').innerText = "Berhasil dikirim ke Firebase!";
                document.getElementById('status').style.color = "green";
                
                // Reset Form
                document.getElementById('movieTitle').value = '';
                document.getElementById('movieGenre').value = '';
                document.getElementById('moviePoster').value = '';
                document.getElementById('dropboxLink').value = '';
            })
            .catch((error) => {
                console.error(error);
                document.getElementById('status').innerText = "Error: " + error.message;
                document.getElementById('status').style.color = "red";
            })
            .finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
    }
</script>

</body>
</html>
