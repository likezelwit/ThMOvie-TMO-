<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMO Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { text-align: center; color: #0078ff; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; outline: none; font-size: 1rem; }
        input:focus { border-color: #0078ff; }
        button { width: 100%; padding: 15px; background: #0078ff; color: white; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0056b3; transform: translateY(-2px); }
        .note { font-size: 0.8rem; color: #888; margin-top: 5px; }
        #status { margin-top: 20px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-upload"></i> Tambah Film</h2>
    
    <div class="form-group">
        <label>Judul Film</label>
        <input type="text" id="movieTitle" value="Attack On Titan High School">
    </div>

    <div class="form-group">
        <label>Genre</label>
        <input type="text" id="movieGenre" value="Animation, Action">
    </div>

    <div class="form-group">
        <label>Link Poster (URL Gambar)</label>
        <!-- Mengambil src dari kode gambar yang Anda berikan -->
        <input type="text" id="moviePoster" value="https://i.ibb.co.com/bwFGNvt/MV5-BZm-Vk-ODZj-ODgt-Yj-Yz-YS00-Yz-Mz-LTli-Nm-It-Mz-Ax-MTAz-Nzkx-MWI3-Xk-Ey-Xk-Fqc-Gc-V1.jpg">
    </div>

    <div class="form-group">
        <label>Link Dropbox Video (Harus diakhiri &dl=0)</label>
        <input type="text" id="dropboxLink" value="https://www.dropbox.com/scl/fi/c2gb5n9r9pep1gsdo6z82/Attack-On-Titan-High-School-Shingeki-Kyojin-chuugakkou-eps-1-indonesia-sub-Bstation.mp4?rlkey=0cg5yqmy35616hjsh0ykycf2m&st=i9srle11&dl=0">
        <div class="note">Sistem akan otomatis mengubah link menjadi &raw=1</div>
    </div>

    <button onclick="uploadMovie()">Kirim ke Firebase</button>
    <div id="status"></div>
</div>

<script type="module">
    // --- PASTIKAN ANDA MENGISI KONFIGURASI INI DARI FIREBASE CONSOLE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "ISI_API_KEY_ANDA_DISINI",
        authDomain: "PROJECT_ID_ANDA.firebaseapp.com",
        databaseURL: "https://PROJECT_ID_ANDA-default-rtdb.firebaseio.com",
        projectId: "PROJECT_ID_ANDA",
        storageBucket: "PROJECT_ID_ANDA.appspot.com",
        messagingSenderId: "SENDER_ID",
        appId: "APP_ID"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const moviesRef = ref(db, 'movies');

    window.uploadMovie = function() {
        const title = document.getElementById('movieTitle').value;
        const genre = document.getElementById('movieGenre').value;
        const poster = document.getElementById('moviePoster').value;
        let videoLink = document.getElementById('dropboxLink').value;

        // Logika Ubah Link Dropbox
        if (videoLink.includes('&dl=0')) {
            videoLink = videoLink.replace('&dl=0', '&raw=1');
            console.log("Link dikonversi ke Raw:", videoLink);
        } else {
            alert("Pastikan link Dropbox diakhiri dengan &dl=0");
            return;
        }

        const newMovie = {
            title: title,
            genre: genre,
            poster: poster,
            videoSource: videoLink,
            createdAt: new Date().toISOString()
        };

        push(moviesRef, newMovie)
            .then(() => {
                document.getElementById('status').innerText = "Berhasil dikirim ke Firebase!";
                document.getElementById('status').style.color = "green";
                // Bersihkan input jika mau
                // document.getElementById('movieTitle').value = '';
            })
            .catch((error) => {
                document.getElementById('status').innerText = "Error: " + error.message;
                document.getElementById('status').style.color = "red";
            });
    }
</script>

</body>
</html>
