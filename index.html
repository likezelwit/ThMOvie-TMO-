<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThMovie XXI - Home</title>
    <style>
        body { 
            background: linear-gradient(180deg, #101518 0%, #0b0d0e 100%) !important; 
            color: #ffffff !important; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            text-align: center;
        }
        .xxi-navbar {
            background-color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .xxi-brand {
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
            color: #004d40;
        }
        .xxi-tag {
            background-color: #00897b;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .xxi-hero-text {
            margin: 40px auto 20px auto;
            font-size: 28px;
            font-weight: 300;
            color: #e0e0e0;
        }
        .xxi-hero-text strong {
            color: #00bfa5;
        }
        .xxi-menu-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px auto 40px auto;
            max-width: 600px;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #b0bec5;
            font-size: 13px;
        }
        .icon-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #00897b;
            background-color: #162025;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-bottom: 8px;
        }
        .now-playing-section {
            max-width: 950px;
            margin: 0 auto;
            text-align: left;
            padding: 0 20px;
        }
        .section-title {
            font-size: 20px;
            font-weight: 600;
            border-left: 5px solid #00bfa5;
            padding-left: 10px;
            margin-bottom: 25px;
        }
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }
        .poster-card {
            background-color: #162025;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #25333c;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: white;
            display: block;
        }
        .poster-card:hover {
            transform: scale(1.04);
            border-color: #00bfa5;
        }
        .poster-img-dummy {
            width: 100%;
            height: 240px;
            background: linear-gradient(45deg, #004d40, #00796b);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .poster-info {
            padding: 12px;
        }
        .movie-title {
            font-size: 14px;
            font-weight: bold;
            margin: 0 0 5px 0;
        }
        .movie-type {
            font-size: 11px;
            color: #00bfa5;
            background-color: rgba(0,191,165,0.1);
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .footer { 
            margin-top: 80px; 
            padding: 20px;
            font-size: 12px; 
            color: #546e7a;
            border-top: 1px solid #1c2429;
            background-color: #090c0e;
        }
    </style>
</head>
<body>

    <div class="xxi-navbar">
        <div class="xxi-brand">ThMovie XXI</div>
        <div class="xxi-tag">JABODETABEK</div>
    </div>

    <div class="xxi-hero-text">
        Feel the moments <strong>beyond</strong>
    </div>

    <div class="xxi-menu-container">
        <div class="menu-item"><div class="icon-circle">🎬</div><span>Cinema</span></div>
        <div class="menu-item"><div class="icon-circle">🎥</div><span>Movies</span></div>
        <div class="menu-item"><div class="icon-circle">🍿</div><span>m.food</span></div>
        <div class="menu-item"><div class="icon-circle">🛋️</div><span>Private</span></div>
    </div>

    <div class="now-playing-section">
        <div class="section-title">Now Playing</div>
        <div class="poster-grid">
            
            <a href="tes.html" class="poster-card">
                <div class="poster-img-dummy">ATTACK ON TITAN<br>High School<br>Episode 1</div>
                <div class="poster-info">
                    <p class="movie-title">AOT Junior High E01</p>
                    <span class="movie-type">SUNDA/IND SUB</span>
                </div>
            </a>

            <div class="poster-card" style="opacity: 0.4; cursor: default;">
                <div class="poster-img-dummy" style="background: #25333c;">Coming<br>Soon</div>
                <div class="poster-info">
                    <p class="movie-title">Episode 02</p>
                    <span class="movie-type" style="color:#78909c; background:none;">2D</span>
                </div>
            </div>

        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 ThMovie Production by Gilang - Kelas VI A.</p>
    </div>

</body>
</html>
